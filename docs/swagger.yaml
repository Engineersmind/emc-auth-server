basePath: /
definitions:
  admin.CreateTenantResult:
    properties:
      owner:
        $ref: '#/definitions/admin.OwnerResult'
      tenant:
        $ref: '#/definitions/admin.TenantResult'
    type: object
  admin.InviteTenantAdminResult:
    properties:
      action:
        description: "Action is one of:\n\n\tinvited            a new account was
          created and an invitation sent\n\tgrants_added       the address was already
          a tenant-level user; it was\n\t                   made an administrator
          (or its grants widened) without\n\t                   creating a second
          identity\n\tinvitation_resent  an invitation was already outstanding and
          has been\n\t                   superseded by a fresh one"
        type: string
      admin:
        $ref: '#/definitions/admin.TenantAdminResult'
      invite_error:
        type: string
      invite_sent:
        type: boolean
    type: object
  admin.OwnerResult:
    properties:
      email:
        type: string
      id:
        type: string
      invite_error:
        type: string
      invite_sent:
        type: boolean
      role:
        type: string
      status:
        type: string
    type: object
  admin.PermissionResult:
    properties:
      application_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      tenant_id:
        type: string
    type: object
  admin.PlatformAdminResult:
    properties:
      applications:
        description: |-
          Applications names the applications a co-owner administers. Empty for an
          owner, who administers every application in their tenant — the two empties
          mean opposite things, so read this with Role.
        items:
          type: string
        type: array
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        description: |-
          ID is the tenant_admins row, which is what the per-tenant management
          endpoints take. UserID is the account behind it, for the user-detail and
          session endpoints.
        type: string
      is_primary:
        type: boolean
      last_login_at:
        type: string
      logins_count:
        type: integer
      mfa_enabled:
        type: boolean
      name:
        type: string
      role:
        description: Role is "owner" or "co_owner".
        type: string
      status:
        description: |-
          Status is "active", "pending_invitation" (granted but never accepted), or
          "blocked". Distinguishing the last matters: a blocked administrator still
          holds their grant and regains it the moment the block is lifted.
        type: string
      tenant_id:
        type: string
      tenant_name:
        type: string
      tenant_slug:
        type: string
      user_id:
        type: string
    type: object
  admin.PlatformAdminStats:
    properties:
      co_owners:
        type: integer
      no_mfa:
        type: integer
      owners:
        type: integer
      pending_invitations:
        type: integer
      tenants_without_owner:
        type: integer
      total_admins:
        type: integer
    type: object
  admin.PlatformAdminsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/admin.PlatformAdminResult'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  admin.RoleResult:
    properties:
      application_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/admin.PermissionResult'
        type: array
      tenant_id:
        type: string
    type: object
  admin.SessionPolicyInput:
    properties:
      absolute_ttl_seconds:
        type: integer
      allow_persistent:
        type: boolean
      idle_ttl_seconds:
        type: integer
      max_concurrent_sessions:
        type: integer
      non_persistent_idle_ttl_seconds:
        type: integer
    type: object
  admin.SessionPolicyView:
    properties:
      absolute_ttl_seconds:
        type: integer
      allow_persistent:
        type: boolean
      idle_ttl_seconds:
        type: integer
      inherited:
        description: |-
          Inherited is true when no row exists at the requested scope and these
          values came from a broader one.
        type: boolean
      max_concurrent_sessions:
        type: integer
      non_persistent_idle_ttl_seconds:
        type: integer
      scope:
        description: |-
          Scope is "platform", "tenant", or "application" — which row actually
          answered the request. Without it a caller cannot tell a policy they have set
          from an inherited default, and would have no way to know that editing it
          creates a new row rather than changing an existing one.
        type: string
    type: object
  admin.TenantAdminResult:
    properties:
      applications:
        description: |-
          Applications is empty for an owner — not because they administer none,
          but because they administer all of them. Read it together with Role.
        items:
          type: string
        type: array
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_primary:
        type: boolean
      name:
        type: string
      role:
        description: Role is "owner" or "co_owner".
        type: string
      status:
        description: |-
          Status is "active" once the invitation has been accepted and the address
          verified, "pending_invitation" until then. An administrator who is
          pending does not count toward the last-usable-owner guard.
        type: string
    type: object
  admin.TenantDashboardDelta:
    properties:
      active_tenants_pct:
        type: number
      total_applications_pct:
        type: number
      total_tenants_pct:
        type: number
      total_users_pct:
        type: number
    type: object
  admin.TenantDashboardStats:
    properties:
      active_tenants:
        type: integer
      delta:
        $ref: '#/definitions/admin.TenantDashboardDelta'
      total_applications:
        type: integer
      total_tenants:
        type: integer
      total_users:
        type: integer
    type: object
  admin.TenantResult:
    properties:
      cors_origins:
        items:
          type: string
        type: array
      created_at:
        type: string
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      plan:
        type: string
      region:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  admin.TenantsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/admin.TenantResult'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  admin.UserDetail:
    properties:
      active_sessions:
        type: integer
      application_id:
        type: string
      block_reason:
        type: string
      blocked_at:
        description: |-
          Lockout state. BlockReason distinguishes an automatic failed-attempt
          lockout (which the user can lift via an emailed link) from an operator
          block (which they cannot) — without it an admin cannot tell why an account
          is inactive. Both are nil for an account that was never blocked.
        type: string
      connections:
        description: |-
          Connections lists how this user can sign in: "password" when a
          credentials row exists, plus every linked federated provider (Auth0's
          "Connection" column).
        items:
          type: string
        type: array
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      failed_login_attempts:
        description: |-
          FailedLoginAttempts is the current consecutive-failure count, so an admin
          can see an account approaching the lockout threshold.
        type: integer
      first_name:
        type: string
      id:
        type: string
      identities:
        items:
          $ref: '#/definitions/admin.UserIdentity'
        type: array
      is_active:
        type: boolean
      last_login_at:
        description: LastLoginAt is the most recent session activity (Auth0's "Latest
          Login").
        type: string
      last_name:
        type: string
      logins_count:
        description: |-
          LoginsCount is the number of successful logins on record (audit-derived,
          Auth0's stats.loginsCount equivalent).
        type: integer
      mfa:
        $ref: '#/definitions/admin.UserMFAStatus'
      pending_invitation:
        description: |-
          PendingInvitation is true when an unused, unexpired invitation exists —
          the account has been created but never claimed.
        type: boolean
      role:
        type: string
      role_id:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  admin.UserIdentity:
    properties:
      created_at:
        type: string
      provider:
        type: string
      provider_email:
        type: string
    type: object
  admin.UserMFAStatus:
    properties:
      backup_codes_remaining:
        type: integer
      email_enabled:
        type: boolean
      totp_enabled:
        type: boolean
    type: object
  admin.UserResult:
    properties:
      application_id:
        type: string
      connections:
        description: |-
          Connections lists how this user can sign in: "password" when a
          credentials row exists, plus every linked federated provider (Auth0's
          "Connection" column).
        items:
          type: string
        type: array
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login_at:
        description: LastLoginAt is the most recent session activity (Auth0's "Latest
          Login").
        type: string
      last_name:
        type: string
      logins_count:
        description: |-
          LoginsCount is the number of successful logins on record (audit-derived,
          Auth0's stats.loginsCount equivalent).
        type: integer
      role:
        type: string
      role_id:
        type: string
      tenant_id:
        type: string
    type: object
  admin.UserSession:
    properties:
      absolute_expires_at:
        type: string
      amr:
        description: AMR lists the authentication methods used to establish the session.
        items:
          type: string
        type: array
      auth_time:
        description: |-
          AuthTime is when the user actually authenticated, as opposed to when the
          current token in the family was minted.
        type: string
      created_at:
        type: string
      device_hint:
        description: |-
          DeviceHint is the server-parsed "Chrome on Windows" form of UserAgent.

          Both are returned: the hint so a consumer does not need its own User-Agent
          parser to show a user which device they are looking at, the raw header because
          it is the evidence and a parser that guesses wrong must not destroy it.
        type: string
      expires_at:
        type: string
      idle_expires_at:
        description: |-
          IdleExpiresAt is when the session dies if it is not used again, and
          AbsoluteExpiresAt is the hard deadline it cannot outlive whatever it does.
          Both are surfaced because "expires_at" alone cannot answer the question an
          operator actually has — is this session about to go away on its own, or does
          it need revoking? Nullable for rows written before migration 00068.
        type: string
      ip_address:
        type: string
      is_current:
        description: |-
          IsCurrent marks the session the caller is making this request from.

          Only ever true on the end-user (/me/sessions) view, where the caller and the
          subject are the same person: it prevents somebody from revoking the session
          they are sitting in and wondering why the page broke. On the admin view the
          caller is a different person from the subject, so no session in the list can
          be theirs and the field stays false throughout.
        type: boolean
      is_persistent:
        description: IsPersistent records whether the user asked to be remembered
          on this device.
        type: boolean
      last_used_at:
        type: string
      session_family_id:
        type: string
      user_agent:
        type: string
    type: object
  admin.UsersPage:
    properties:
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
      users:
        items:
          $ref: '#/definitions/admin.UserResult'
        type: array
    type: object
  audit.LogEntry:
    properties:
      action:
        type: string
      actor_email:
        type: string
      agent_id:
        type: string
      application_id:
        type: string
      application_name:
        type: string
      auth_method:
        type: string
      created_at:
        type: string
      http_status:
        type: integer
      id:
        type: string
      ip_address:
        type: string
      metadata:
        type: object
      request_id:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      tenant_slug:
        type: string
      user_agent:
        type: string
      user_id:
        type: string
    type: object
  audit.LogsPage:
    properties:
      logs:
        items:
          $ref: '#/definitions/audit.LogEntry'
        type: array
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  audit.StatsResult:
    properties:
      active_users_week:
        type: integer
      failed_logins_today:
        type: integer
      logins_today:
        type: integer
      logouts_today:
        type: integer
      recent_events:
        items:
          $ref: '#/definitions/audit.LogEntry'
        type: array
      total_audit_events:
        type: integer
    type: object
  audit.VerifyResult:
    properties:
      broken_at_id:
        description: BrokenAtID is the id of the first row whose hash/linkage failed,
          when any.
        type: string
      checked:
        description: Checked is the number of rows verified.
        type: integer
      detail:
        description: Detail is a human-readable description of the break (or "ok").
        type: string
      intact:
        description: Intact is true when every checked row's hash and linkage verified.
        type: boolean
    type: object
  auth.APIKeyResult:
    properties:
      created_at:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  auth.APIKeySummary:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  auth.AgentAnalysis:
    properties:
      agent_id:
        type: string
      agent_name:
        type: string
      agent_type:
        type: string
      off_hours_count_24h:
        description: requests outside 08:00–20:00 UTC
        type: integer
      rate_limit_hits_24h:
        description: events with action containing "rate_limit"
        type: integer
      request_count_24h:
        description: total audit events in last 24h
        type: integer
      risk_factors:
        description: human-readable reasons for elevated score
        items:
          type: string
        type: array
      risk_score:
        description: 0–100 composite score
        type: integer
      unique_ips_24h:
        description: distinct IP addresses seen
        type: integer
    type: object
  auth.AgentRegistrationResult:
    properties:
      agent_type:
        type: string
      capabilities:
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: string
      key:
        description: shown once — never stored
        type: string
      key_prefix:
        type: string
      name:
        type: string
    type: object
  auth.AgentWithStats:
    properties:
      agent_type:
        type: string
      capabilities:
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: string
      key_prefix:
        type: string
      last_active:
        description: most recent audit event timestamp
        type: string
      last_used_at:
        type: string
      name:
        type: string
      request_count:
        description: total audit events attributed to this agent
        type: integer
    type: object
  auth.AppDetail:
    properties:
      app_type:
        type: string
      client_id:
        type: string
      created_at:
        type: string
      first_party:
        description: |-
          FirstParty false means a consent screen is required before a code may be
          issued. No consent screen exists yet, so /oauth/authorize refuses such a
          client outright rather than skipping consent silently.
        type: boolean
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      redirect_uris:
        description: |-
          RedirectURIs is the exact-match allow-list for GET /oauth/authorize
          (issue #6). Empty means the application cannot use the authorization
          code flow at all — which is the correct default for the m2m app_type.
        items:
          type: string
        type: array
      require_pkce:
        description: RequirePKCE defaults true for every client type, confidential
          included.
        type: boolean
      scopes:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  auth.AppRateLimit:
    properties:
      application_id:
        type: integer
      burst:
        type: integer
      created_at:
        type: string
      description:
        type: string
      requests_per_minute:
        type: integer
      tenant_id:
        type: integer
      updated_at:
        type: string
    type: object
  auth.AppResult:
    properties:
      app_type:
        type: string
      client_id:
        type: string
      client_secret:
        type: string
      created_at:
        type: string
      first_party:
        type: boolean
      id:
        type: string
      name:
        type: string
      redirect_uris:
        items:
          type: string
        type: array
      require_pkce:
        type: boolean
      scopes:
        items:
          type: string
        type: array
    type: object
  auth.AppsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/auth.AppDetail'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  auth.AuthResult:
    properties:
      access_token:
        type: string
      expires_at:
        description: UTC unix timestamp when access token expires
        type: integer
      expires_in:
        description: seconds until access token expires
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.EmailSenderSettings:
    properties:
      application_id:
        description: nil = tenant-level
        type: string
      from_address:
        type: string
      from_name:
        type: string
      has_api_key:
        description: 'sendgrid: an API key is stored'
        type: boolean
      has_password:
        type: boolean
      is_active:
        type: boolean
      logo_url:
        type: string
      product_name:
        type: string
      provider:
        description: '"smtp" | "sendgrid"'
        type: string
      reply_to:
        type: string
      smtp_host:
        type: string
      smtp_port:
        type: integer
      smtp_username:
        type: string
      subject_prefix:
        type: string
      tenant_id:
        type: string
      tls_mode:
        type: string
      updated_at:
        type: string
    type: object
  auth.EmailTemplate:
    properties:
      application_id:
        description: nil = tenant-level
        type: string
      html_body:
        type: string
      is_active:
        type: boolean
      is_default:
        description: true when returned from the built-in fallback
        type: boolean
      subject:
        type: string
      template_type:
        type: string
      tenant_id:
        type: string
      text_body:
        type: string
      updated_at:
        type: string
    type: object
  auth.EnrollResult:
    properties:
      backup_codes:
        items:
          type: string
        type: array
      otp_uri:
        type: string
    type: object
  auth.InvitationPreview:
    properties:
      email:
        type: string
      grants_admin:
        description: |-
          GrantsAdmin reports that accepting will also activate a pending
          administrative grant, so the page can say what is being confirmed.
        type: boolean
      requires_password:
        type: boolean
    type: object
  auth.MFAPolicy:
    properties:
      allowed_methods:
        items:
          type: string
        type: array
      application_id:
        type: string
      email_enrolled_users:
        type: integer
      enrolled_users:
        description: |-
          Enrollment stats over the application's own isolated user base — for the
          owner dashboard. Pending = TOTP enrolled but never activated.
        type: integer
      magic_link_enabled:
        description: |-
          Passwordless magic-link sign-in (opt-in; the redirect URL is the
          application frontend that receives ?token=…).
        type: boolean
      magic_link_redirect_url:
        type: string
      mode:
        type: string
      pending_enrollments:
        type: integer
      total_users:
        type: integer
      updated_at:
        description: UpdatedAt is nil when no explicit policy row exists (implicit
          'optional').
        type: string
    type: object
  auth.MeResult:
    properties:
      admin_apps:
        items:
          type: string
        type: array
      admin_scope:
        description: |-
          AdminScope and AdminApps mirror the token's administrative reach (issue
          #97) so a client can render the same boundary the server enforces —
          showing a co-owner only the applications they administer, rather than
          offering every tenant-level control and letting each one 403 on submit.
          Empty for callers who are not tenant administrators.
        type: string
      email:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      tenant_id:
        type: string
      user_id:
        type: string
    type: object
  auth.ProviderConfigDetail:
    properties:
      callback_url:
        type: string
      client_id:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      has_secret:
        type: boolean
      id:
        type: string
      provider:
        type: string
      redirect_allow:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  auth.ProviderTestCheck:
    properties:
      detail:
        type: string
      name:
        type: string
      passed:
        type: boolean
    type: object
  auth.ProviderTestResult:
    properties:
      callback_url:
        type: string
      checks:
        items:
          $ref: '#/definitions/auth.ProviderTestCheck'
        type: array
      enabled:
        type: boolean
      ok:
        type: boolean
      provider:
        type: string
      secret_verified:
        type: boolean
    type: object
  auth.RegisterResult:
    properties:
      application_id:
        description: |-
          ApplicationID is set when the account belongs to one application's isolated
          user base, nil for a tenant-level account.
        type: integer
      email:
        type: string
      role:
        type: string
      tenant_id:
        type: integer
      user_id:
        type: integer
    type: object
  auth.TOTPStatus:
    properties:
      active:
        type: boolean
      backup_codes_remaining:
        type: integer
      email_active:
        type: boolean
      enrolled:
        type: boolean
    type: object
  auth.UserIdentityDetail:
    properties:
      created_at:
        type: string
      id:
        type: string
      provider:
        type: string
      provider_email:
        type: string
    type: object
  handlers.AcceptInvitationRequest:
    properties:
      current_password:
        type: string
      password:
        description: |-
          omitempty, not required: this field is optional now that an existing
          account may confirm with CurrentPassword instead. min=8 still applies
          whenever it is supplied, restoring the HTTP-layer floor that the service's
          ErrWeakPassword otherwise enforces alone.
        minLength: 8
        type: string
      token:
        type: string
    required:
    - token
    type: object
  handlers.AppLimitRequest:
    properties:
      burst:
        type: integer
      description:
        type: string
      requests_per_minute:
        type: integer
    type: object
  handlers.AppLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      remember_me:
        description: RememberMe asks for a persistent session. See LoginRequest.RememberMe.
        type: boolean
    required:
    - email
    - password
    type: object
  handlers.AppRegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.AssignRoleRequest:
    properties:
      role_id:
        type: string
    type: object
  handlers.AuthenticateAgentRequest:
    properties:
      key:
        type: string
      tenant_id:
        type: string
    type: object
  handlers.ChangeEmailRequest:
    properties:
      new_email:
        type: string
    required:
    - new_email
    type: object
  handlers.CreateAPIKeyRequest:
    properties:
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  handlers.CreateApplicationRequest:
    properties:
      app_type:
        description: web | spa | m2m | native; defaults to web
        type: string
      first_party:
        description: |-
          FirstParty defaults to true when omitted. Setting it false marks the
          client as third-party, which currently causes /oauth/authorize to refuse
          it with consent_required — the consent screen is not built yet.
        type: boolean
      name:
        type: string
      redirect_uris:
        description: |-
          RedirectURIs is the exact-match allow-list for GET /oauth/authorize
          (issue #6). Without at least one entry the application cannot use the
          authorization code flow at all — which is the right default for m2m.
        items:
          type: string
        type: array
      require_pkce:
        description: |-
          RequirePKCE defaults to true when omitted. Pointer so "omitted" is
          distinguishable from an explicit false.
        type: boolean
      scopes:
        description: |-
          Scopes accepts resource:action permission strings and the reserved OIDC
          scopes (openid, profile, email, offline_access). Optional.
        items:
          type: string
        type: array
    type: object
  handlers.CreatePermissionRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  handlers.CreateRoleRequest:
    properties:
      name:
        type: string
      permission_ids:
        items:
          type: string
        type: array
    type: object
  handlers.CreateTenantRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      name:
        type: string
      owner_email:
        type: string
      plan:
        type: string
      region:
        type: string
      slug:
        type: string
    type: object
  handlers.CreateUserAdminRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      role_id:
        type: string
      send_invitation:
        description: |-
          SendInvitation emails the user a link to set their own password instead of
          the admin choosing one. When true, Password must be omitted — supplying
          both is contradictory and is rejected rather than silently resolved.
        type: boolean
    type: object
  handlers.EmailMFACodeRequest:
    properties:
      code:
        type: string
    type: object
  handlers.EraseUserAuditRequest:
    properties:
      user_id:
        type: string
    type: object
  handlers.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
    type: object
  handlers.InviteTenantAdminRequest:
    properties:
      application_ids:
        description: |-
          ApplicationIDs is required for a co-owner and must be absent for an
          owner, whose reach is every application in the tenant.
        items:
          type: string
        type: array
      email:
        type: string
      role:
        description: Role is "owner" or "co_owner".
        type: string
    type: object
  handlers.LoginOTPRequest:
    properties:
      code:
        type: string
      otp_session_token:
        type: string
    type: object
  handlers.LoginOTPResendRequest:
    properties:
      otp_session_token:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      remember_me:
        description: |-
          RememberMe asks for a persistent session — the tenant's longer idle timeout
          instead of the short one meant for shared machines. Honoured only when the
          tenant's session policy allows persistent sessions.

          Absent means false, so a client that has not been updated keeps getting the
          shorter session. That is the right default for an omitted security-relevant
          flag: the failure mode is a user signing in more often than they need to,
          not a month-long session on a library computer.
        type: boolean
    required:
    - email
    - password
    type: object
  handlers.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.MFAActivateRequest:
    properties:
      code:
        type: string
      enrollment_token:
        type: string
    type: object
  handlers.MFAEmailPendingRequest:
    properties:
      enrollment_token:
        type: string
    type: object
  handlers.MFAEnrollRequest:
    properties:
      enrollment_token:
        type: string
    type: object
  handlers.MagicLinkRequest:
    properties:
      email:
        type: string
    type: object
  handlers.MagicLinkVerifyRequest:
    properties:
      token:
        type: string
    type: object
  handlers.OAuthExchangeRequest:
    properties:
      client_id:
        type: string
      login_code:
        type: string
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.RegisterAgentRequest:
    properties:
      agent_type:
        type: string
      capabilities:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  handlers.SendTestEmailRequest:
    properties:
      allow_inherited:
        description: |-
          AllowInherited permits an application-addressed test to proceed when the
          application has no sender of its own and would fall through to the
          tenant's or the platform's. Default false; see PR #91 for the reasoning.
        type: boolean
      template_type:
        description: TemplateType selects which template to render (empty = email_verification).
        type: string
      to:
        description: |-
          To is the recipient. Empty = the requesting admin's own address.

          INVARIANT: a recipient other than the caller's own address always gets the
          built-in diagnostic template, never a per-scope override — see the
          enforcement in SendTestEmail. Template bodies are editable at this same
          permission level, so allowing both an arbitrary recipient and arbitrary
          content would make this a phishing relay from a verified sender identity.
          See PR #91 for the full threat model.
        type: string
    type: object
  handlers.SendTestEmailResponse:
    properties:
      message:
        type: string
      provider:
        description: smtp | sendgrid | dev
        type: string
      scope:
        description: application | tenant | global
        type: string
      template:
        type: string
      to:
        type: string
    type: object
  handlers.SessionLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      remember_me:
        description: |-
          RememberMe asks for a persistent session — the tenant's longer idle timeout
          instead of the short one meant for shared machines. Honoured only when the
          tenant's session policy allows persistent sessions.

          Absent means false, so a client that has not been updated keeps getting the
          shorter session. That is the right default for an omitted security-relevant
          flag: the failure mode is a user signing in more often than they need to,
          not a month-long session on a library computer.
        type: boolean
    required:
    - email
    - password
    type: object
  handlers.SetTenantAdminGrantsRequest:
    properties:
      application_ids:
        items:
          type: string
        type: array
    type: object
  handlers.SetUserStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  handlers.SigningKeyInfo:
    properties:
      activated_at:
        type: string
      algorithm:
        type: string
      created_at:
        type: string
      kid:
        type: string
      retired_at:
        type: string
      status:
        type: string
    type: object
  handlers.SigningKeyListResponse:
    properties:
      jwks_url:
        description: |-
          JWKSURL is where verifiers should fetch these keys. Returned so an operator
          never has to construct it by hand or guess the scheme.
        type: string
      keys:
        items:
          $ref: '#/definitions/handlers.SigningKeyInfo'
        type: array
    type: object
  handlers.SlugCheckResponse:
    properties:
      available:
        type: boolean
      slug:
        type: string
    type: object
  handlers.TOTPActivateRequest:
    properties:
      code:
        type: string
    type: object
  handlers.TOTPDisableRequest:
    properties:
      code:
        type: string
    type: object
  handlers.TOTPEnrollRequest:
    properties:
      code:
        type: string
    type: object
  handlers.TOTPRegenerateCodesRequest:
    properties:
      code:
        type: string
    type: object
  handlers.TokenRequest:
    properties:
      grant_type:
        type: string
    type: object
  handlers.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      id_token:
        description: |-
          IDToken appears only when the granted scopes include `openid`. Its
          presence is what makes this an OIDC response rather than a plain OAuth 2.0 one.
        type: string
      refresh_token:
        description: |-
          RefreshToken is omitted for client_credentials: RFC 6749 §4.4.3 says a
          refresh token SHOULD NOT be issued, because a client that can present its
          own credentials can simply ask for another token.
        type: string
      scope:
        description: |-
          Scope is the GRANTED set, which may be narrower than what was requested
          (RFC 6749 §3.3). Echoed so a client can see what it actually received
          rather than assuming its request was honoured in full.
        type: string
      token_type:
        type: string
    type: object
  handlers.UpdateApplicationMFARequest:
    properties:
      allowed_methods:
        items:
          type: string
        type: array
      magic_link_enabled:
        type: boolean
      magic_link_redirect_url:
        type: string
      mode:
        type: string
    type: object
  handlers.UpdateApplicationRequest:
    properties:
      app_type:
        type: string
      first_party:
        type: boolean
      name:
        type: string
      redirect_uris:
        description: RedirectURIs omitted = unchanged; [] clears — same convention
          as Scopes.
        items:
          type: string
        type: array
      require_pkce:
        description: Nil leaves the flag unchanged.
        type: boolean
      scopes:
        items:
          type: string
        type: array
    type: object
  handlers.UpdateCORSOriginsRequest:
    properties:
      origins:
        description: e.g. ["https://app.example.com"]
        items:
          type: string
        type: array
    type: object
  handlers.UpdateRolePermissionsRequest:
    properties:
      permission_ids:
        items:
          type: string
        type: array
    type: object
  handlers.UpdateTenantRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      name:
        type: string
      plan:
        type: string
      region:
        type: string
    type: object
  handlers.UpdateUserAdminRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  handlers.UpsertEmailSenderRequest:
    properties:
      api_key:
        description: |-
          APIKey is the SendGrid API key (provider="sendgrid"); write-only. Empty on
          update keeps the stored key. Response exposes only has_api_key.
        type: string
      from_address:
        type: string
      from_name:
        description: Branding (all optional).
        type: string
      is_active:
        type: boolean
      logo_url:
        type: string
      product_name:
        type: string
      provider:
        description: 'Provider: "smtp" (default) or "sendgrid".'
        type: string
      reply_to:
        type: string
      smtp_host:
        type: string
      smtp_password:
        type: string
      smtp_port:
        type: integer
      smtp_username:
        type: string
      subject_prefix:
        type: string
      tls_mode:
        description: 'TLSMode: "ssl" | "starttls" | "opportunistic" | "none" (empty
          = derive from port).'
        type: string
    type: object
  handlers.UpsertEmailTemplateRequest:
    properties:
      html_body:
        type: string
      is_active:
        type: boolean
      subject:
        type: string
      text_body:
        type: string
    type: object
  handlers.UpsertProviderConfigRequest:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      enabled:
        type: boolean
      redirect_allow:
        items:
          type: string
        type: array
    type: object
  handlers.UserInfoResponse:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      family_name:
        type: string
      given_name:
        type: string
      name:
        type: string
      sub:
        description: |-
          Subject is the stable, permanent identifier for the user.

          This is the raw user id, deliberately, and it must stay consistent with the
          "sub" already carried in every access token (JWTService.Sign sets
          Subject: c.UserID). OIDC Core requires the token's sub and UserInfo's sub to
          match; returning a pairwise (per-client) subject here while tokens carry the
          raw id would violate that and give the same person two identities.

          Pairwise subjects are the privacy-preserving alternative, keeping two
          applications from correlating the same user. Adding them later means
          changing BOTH this and the token claim, and is only safe for a client that
          has never received a subject in the current format — a relying party stores
          sub as its primary key for the user, so changing it orphans every linked
          account. The natural place is a per-client setting introduced with the
          client registry in issue #6/#8, applied from that client's first token.
        type: string
      updated_at:
        description: |-
          UpdatedAt is seconds since the Unix epoch, per OIDC Core — not RFC 3339,
          which is what the rest of this API returns for timestamps.
        type: integer
    type: object
  handlers.tokenError:
    properties:
      error:
        type: string
      error_description:
        type: string
    type: object
  saml.SAMLConfig:
    properties:
      certificate:
        type: string
      created_at:
        type: string
      entity_id:
        type: string
      id:
        type: string
      sso_url:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8082
info:
  contact:
    name: EngineersMind
    url: https://github.com/engineersmind/emc-auth-server
  description: Standalone multi-tenant Identity Provider — email/password auth, JWT,
    refresh tokens, TOTP 2FA, SAML 2.0, RBAC, Admin UI, and AI/Agent security.
  license:
    name: MIT
  title: EMC Auth Server
  version: 1.5.0
paths:
  /api/v1/administrators:
    get:
      description: Lists owners and co-owners in EVERY tenant, for platform oversight
        — the per-tenant equivalent is /tenants/{tid}/admins. Rows carry the tenant,
        sign-in history and second-factor state because the reader has no other context.
        An owner's applications array is empty because they administer every application
        in their tenant; a co-owner's lists exactly theirs, so read it together with
        role. Requires tenant:manage (super_admin only).
      parameters:
      - description: Match on email, name, tenant name or slug
        in: query
        name: search
        type: string
      - description: owner | co_owner
        in: query
        name: role
        type: string
      - description: active | pending_invitation | blocked
        in: query
        name: status
        type: string
      - description: 1-based page number
        in: query
        name: page
        type: integer
      - description: Rows per page (default 25, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.PlatformAdminsPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Directory of every administrator across all tenants
      tags:
      - admin-platform
  /api/v1/administrators/stats:
    get:
      description: 'Counts across every tenant: total administrators, owners, co-owners,
        unaccepted invitations, administrators without a second factor, and tenants
        with no owner who can sign in. The last two are the numbers worth acting on
        — privileged accounts protected by a password alone, and tenants nobody has
        taken ownership of. Requires tenant:manage.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.PlatformAdminStats'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Administrator directory summary
      tags:
      - admin-platform
  /api/v1/agents:
    get:
      description: Returns all active agent registrations for the requesting tenant.
        Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.AgentWithStats'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List agent registrations
      tags:
      - agent-management
    post:
      consumes:
      - application/json
      description: Creates an agent registration and returns the raw API key once.
        Requires admin:access.
      parameters:
      - description: Agent details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AgentRegistrationResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a new agent
      tags:
      - agent-management
  /api/v1/agents/{id}:
    delete:
      description: Revokes an agent registration belonging to the requesting tenant.
        Requires admin:access.
      parameters:
      - description: Agent UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an agent registration
      tags:
      - agent-management
  /api/v1/agents/analysis:
    get:
      description: Returns risk-scored analysis for all active agents in the tenant.
        Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AgentAnalysis'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get 24h agent risk analysis
      tags:
      - agent-management
  /api/v1/agents/authenticate:
    post:
      consumes:
      - application/json
      description: Validates an agent API key and returns a signed short-lived JWT.
        Public — no prior auth required.
      parameters:
      - description: Agent key and tenant ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthenticateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate an agent and issue a JWT
      tags:
      - agent-auth
  /api/v1/api-keys:
    get:
      description: Returns all active API keys for the caller's tenant. The raw key
        is never included.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.APIKeySummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: Creates a new API key for machine-to-machine auth. The raw key
        is returned exactly once.
      parameters:
      - description: Key name and permissions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.APIKeyResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - api-keys
  /api/v1/api-keys/{id}:
    delete:
      description: Permanently revokes an API key. The key is immediately invalid.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke API key
      tags:
      - api-keys
  /api/v1/app-limits:
    get:
      description: Returns all per-app rate limit configs for the tenant. Requires
        apps:read.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.AppRateLimit'
            type: array
      security:
      - BearerAuth: []
      summary: List app rate limits
      tags:
      - admin-rate-limits
  /api/v1/applications:
    get:
      description: Returns a paginated, filtered list of the tenant's applications.
        Secrets are never included.
      parameters:
      - description: Match on name or client_id
        in: query
        name: search
        type: string
      - description: Filter by app type (web|spa|m2m|native)
        in: query
        name: type
        type: string
      - description: Filter by status (active|inactive); empty = all
        in: query
        name: status
        type: string
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 25, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AppsPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List applications (paginated)
      tags:
      - admin-applications
    post:
      consumes:
      - application/json
      description: Registers a new application for the tenant. Returns client_id and
        client_secret — secret is shown exactly once and can never be retrieved again
        (only rotated).
      parameters:
      - description: Application name and optional type (web|spa|m2m|native)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AppResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
