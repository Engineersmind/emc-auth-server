  /api/v1/tenants:
    get:
      description: 'Returns tenants scoped to the caller''s permissions: callers with
        tenant:manage get a paginated, filtered list of every tenant; any other authenticated
        caller gets only the tenants tied to their own account email, each with their
        role and usage stats (search/status/region/pagination params are ignored in
        that case).'
      parameters:
      - description: Search by name, display name, or domain
        in: query
        name: search
        type: string
      - description: 'Filter by status: active | inactive | suspended (suspended maps
          to inactive)'
        in: query
        name: status
        type: string
      - description: Filter by region (exact match)
        in: query
        name: region
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: 'Rows per page (default 25, max 100); alias: limit'
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.TenantsPage'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List tenants
      tags:
      - admin-tenants
    post:
      consumes:
      - application/json
      description: 'Creates a new isolated tenant and auto-seeds the granular permission
        catalog, an owner role holding all of it, an owner user for the provided owner_email,
        and the matching tenant_admins record. The owner account is created WITHOUT
        a password: an invitation link is emailed, and accepting it sets the password
        and marks the address verified. The response carries owner.status = "pending_invitation"
        and owner.invite_sent; when invite_sent is false the tenant exists but the
        invitation must be resent before the owner can sign in. Requires tenant:manage
        permission (super_admin only). Returns 503 when the server has no email delivery
        configured at all — in that case NOTHING is created, because the invitation
        is the owner''s only route to a password.'
      parameters:
      - description: Tenant details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.CreateTenantResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Slug already taken
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Invitations are not configured; no tenant was created
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create tenant
      tags:
      - admin-tenants
