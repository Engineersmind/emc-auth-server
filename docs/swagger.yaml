      - description: Bearer <app-scoped end-user access token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Basic base64(client_id:client_secret)
        in: header
        name: X-Client-Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeResult'
        "401":
          description: token_invalid — generic for every rejection reason
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Current user, scoped to the calling application
      tags:
      - AUTH
  /api/v1/auth/apps/register:
    post:
      consumes:
      - application/json
      description: 'Creates a user account owned by the authenticated application
        — the same email may hold independent accounts in different applications.
        Application credentials via Authorization: Basic header only; no tenant slug
        needed. Does NOT sign the user in — no session is created and no tokens are
        returned; call /auth/apps/login afterwards.'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AppRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid application credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered in this application
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register an end user via application credentials
      tags:
      - AUTH
  /api/v1/auth/change-email:
    post:
      consumes:
      - application/json
      description: Sends a confirmation link to the new address. The account email
        changes only after the link is followed. Requires a valid access token.
      parameters:
      - description: New email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangeEmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Request an email change
      tags:
      - AUTH
  /api/v1/auth/confirm-email-change:
    get:
      description: Applies a pending email change using the token sent to the new
        address, and marks it verified. Single-use.
      parameters:
      - description: Email change token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm an email change
      tags:
      - AUTH
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 'Sends a reset link to the email address for the authenticated
        application''s user. The application authenticates with Authorization: Basic
        base64(client_id:client_secret) — this identifies both the tenant and application,
        scoping the reset to that app''s account. ALWAYS returns 200 for a valid client
        regardless of whether the email is registered (prevents email enumeration).'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid client credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - AUTH
  /api/v1/auth/invitation:
    get:
      description: Returns what a live invitation token is for, WITHOUT consuming
        it, so the landing page can ask for a password only when there is one to set.
        requires_password is false for an account that already has credentials — an
        existing user being made an administrator, or an administrator being re-instated
        — and for those the link only confirms the grant. grants_admin reports that
        accepting will activate a pending administrative grant.
      parameters:
      - description: Invitation token from the email
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.InvitationPreview'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Inspect an invitation link
      tags:
      - AUTH
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an existing user by email and password only. The
        tenant is resolved automatically from which account the password matches —
        no tenant slug or header is required.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - AUTH
  /api/v1/auth/login/mfa/activate:
    post:
      consumes:
      - application/json
      description: Verifies the first TOTP code for a pending enrollment, marks MFA
        active, and completes the login in the same step — the response carries the
        token pair. 5 incorrect codes invalidate the enrollment session.
      parameters:
      - description: Enrollment token + first TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MFAActivateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid code or expired enrollment token
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Attempt budget exhausted — restart login
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Activate forced MFA enrollment and complete login
      tags:
      - AUTH
  /api/v1/auth/login/mfa/email:
    post:
      consumes:
      - application/json
      description: Sends a one-time code to the pending account's inbox for a login
        against a 'required'-MFA application. Submitting that code to /auth/login/mfa/activate
        enrolls the user in email MFA and completes the login. Available only when
        the application's allowed_methods include "email".
      parameters:
      - description: Enrollment token from the login response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MFAEmailPendingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired enrollment token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Email method not allowed for this application
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Re-send budget exhausted
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Begin forced MFA enrollment via email
      tags:
      - AUTH
  /api/v1/auth/login/mfa/enroll:
    post:
      consumes:
      - application/json
      description: Exchanges the enrollment token returned by a login against a 'required'-MFA
        application for a TOTP secret (otpauth:// URI + backup codes). The token authorizes
        only this call and /auth/login/mfa/activate; no JWT is issued until activation
        completes.
      parameters:
      - description: Enrollment token from the login response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MFAEnrollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EnrollResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired enrollment token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Begin forced MFA enrollment
      tags:
      - AUTH
  /api/v1/auth/login/otp:
    post:
      consumes:
      - application/json
      description: Submit the TOTP code (or backup code) to complete a two-step login.
        The session allows 5 incorrect codes before it is invalidated. Returns the
        full token pair (and sets auth cookies for browser clients).
      parameters:
      - description: OTP session token + TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Attempt budget exhausted — restart login
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete TOTP login
      tags:
      - AUTH
  /api/v1/auth/login/otp/resend:
    post:
      consumes:
      - application/json
      description: Re-sends the one-time email code for an open OTP challenge (max
        3 re-sends per challenge). Only available when the challenge's methods include
        "email".
      parameters:
      - description: OTP session token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginOTPResendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired session
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Re-send budget exhausted
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend login email code
      tags:
      - AUTH
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the supplied refresh token. Idempotent — calling twice
        is safe.
      parameters:
