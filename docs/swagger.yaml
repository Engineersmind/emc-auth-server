      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update tenant CORS origins
      tags:
      - admin-tenants
  /api/v1/tenants/{tid}/permissions:
    get:
      description: Returns all permissions belonging to the specified tenant. Requires
        tenant:manage permission.
      parameters:
      - description: Target tenant ID
        in: path
        name: tid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
