basePath: /
definitions:
  admin.PermissionResult:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      tenant_id:
        type: string
    type: object
  admin.RoleResult:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_system:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/admin.PermissionResult'
        type: array
      tenant_id:
        type: string
    type: object
  admin.TenantDashboardDelta:
    properties:
      active_tenants_pct:
        type: number
      total_applications_pct:
        type: number
      total_tenants_pct:
        type: number
      total_users_pct:
        type: number
    type: object
  admin.TenantDashboardStats:
    properties:
      active_tenants:
        type: integer
      delta:
        $ref: '#/definitions/admin.TenantDashboardDelta'
      total_applications:
        type: integer
      total_tenants:
        type: integer
      total_users:
        type: integer
    type: object
  admin.TenantResult:
    properties:
      cors_origins:
        items:
          type: string
        type: array
      created_at:
        type: string
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      plan:
        type: string
      region:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  admin.TenantsPage:
    properties:
      limit:
        type: integer
      page:
        type: integer
      tenants:
        items:
          $ref: '#/definitions/admin.TenantResult'
        type: array
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  admin.UserResult:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
      role:
        type: string
      role_id:
        type: string
      tenant_id:
        type: string
    type: object
  admin.UsersPage:
    properties:
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
      users:
        items:
          $ref: '#/definitions/admin.UserResult'
        type: array
    type: object
  audit.LogEntry:
    properties:
      action:
        type: string
      actor_email:
        type: string
      agent_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      ip_address:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      tenant_id:
        type: string
      tenant_slug:
        type: string
      user_id:
        type: string
    type: object
  audit.LogsPage:
    properties:
      logs:
        items:
          $ref: '#/definitions/audit.LogEntry'
        type: array
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  auth.APIKeyResult:
    properties:
      created_at:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  auth.APIKeySummary:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  auth.AppRateLimit:
    properties:
      app_id:
        type: string
      burst:
        type: integer
      created_at:
        type: string
      description:
        type: string
      requests_per_minute:
        type: integer
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  auth.AppResult:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth.AppSummary:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth.AuthResult:
    properties:
      access_token:
        type: string
      expires_at:
        description: UTC unix timestamp when access token expires
        type: integer
      expires_in:
        description: seconds until access token expires
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.EnrollResult:
    properties:
      backup_codes:
        items:
          type: string
        type: array
      otp_uri:
        type: string
    type: object
  auth.MeResult:
    properties:
      email:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      tenant_id:
        type: string
      user_id:
        type: string
    type: object
  handlers.AppLimitRequest:
    properties:
      app_id:
        type: string
      burst:
        type: integer
      description:
        type: string
      requests_per_minute:
        type: integer
    type: object
  handlers.AssignRoleRequest:
    properties:
      role_id:
        type: string
    type: object
  handlers.CreateAPIKeyRequest:
    properties:
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  handlers.CreateApplicationRequest:
    properties:
      name:
        type: string
    type: object
  handlers.CreatePermissionRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  handlers.CreateRoleRequest:
    properties:
      name:
        type: string
      permission_ids:
        items:
          type: string
        type: array
    type: object
  handlers.CreateTenantRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      name:
        type: string
      plan:
        type: string
      region:
        type: string
      slug:
        type: string
    type: object
  handlers.CreateUserAdminRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      role_id:
        type: string
    type: object
  handlers.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
    type: object
  handlers.LoginOTPRequest:
    properties:
      code:
        type: string
      otp_session_token:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  handlers.SessionLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.SlugCheckResponse:
    properties:
      available:
        type: boolean
      slug:
        type: string
    type: object
  handlers.TOTPActivateRequest:
    properties:
      code:
        type: string
    type: object
  handlers.TOTPDisableRequest:
    properties:
      code:
        type: string
    type: object
  handlers.TokenRequest:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      grant_type:
        type: string
    type: object
  handlers.UpdateCORSOriginsRequest:
    properties:
      origins:
        description: e.g. ["https://app.example.com"]
        items:
          type: string
        type: array
    type: object
  handlers.UpdateRolePermissionsRequest:
    properties:
      permission_ids:
        items:
          type: string
        type: array
    type: object
  handlers.UpdateTenantRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      name:
        type: string
      plan:
        type: string
      region:
        type: string
    type: object
  handlers.UpdateUserAdminRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
host: localhost:8082
info:
  contact:
    name: EngineersMind
    url: https://github.com/engineersmind/emc-auth-server
  description: Standalone multi-tenant Identity Provider — email/password auth, JWT,
    refresh tokens, TOTP 2FA, SAML 2.0, RBAC, Admin UI, and AI/Agent security.
  license:
    name: MIT
  title: EMC Auth Server
  version: 1.5.0
paths:
  /api/v1/admin/api-keys:
    get:
      description: Returns all active API keys for the caller's tenant. The raw key
        is never included.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.APIKeySummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: Creates a new API key for machine-to-machine auth. The raw key
        is returned exactly once.
      parameters:
      - description: Key name and permissions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.APIKeyResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - api-keys
  /api/v1/admin/api-keys/{id}:
    delete:
      description: Permanently revokes an API key. The key is immediately invalid.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke API key
      tags:
      - api-keys
  /api/v1/admin/app-limits:
    get:
      description: Returns all per-app rate limit configs for the caller's tenant.
        Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.AppRateLimit'
            type: array
      security:
      - BearerAuth: []
      summary: List app rate limits
      tags:
      - admin-rate-limits
    post:
      consumes:
      - application/json
      description: Sets a custom per-minute request limit for an application identified
        by X-App-ID. Requires admin:access.
      parameters:
      - description: App limit config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AppLimitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AppRateLimit'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: app_id already has a rate limit config
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create app rate limit
      tags:
      - admin-rate-limits
  /api/v1/admin/app-limits/{app_id}:
    delete:
      description: Removes the custom rate limit for an app_id; it falls back to the
        default limit. Requires admin:access.
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete app rate limit
      tags:
      - admin-rate-limits
    put:
      consumes:
      - application/json
      description: Updates the rate limit config for an existing app_id in the tenant.
        Requires admin:access.
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      - description: Updated limit config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AppLimitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AppRateLimit'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update app rate limit
      tags:
      - admin-rate-limits
  /api/v1/admin/applications:
    get:
      description: Returns all active applications for the caller's tenant.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.AppSummary'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List applications
      tags:
      - admin-applications
    post:
      consumes:
      - application/json
      description: Registers a new application for the tenant. Returns client_id and
        client_secret — secret is shown exactly once.
      parameters:
      - description: Application name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AppResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create application
      tags:
      - admin-applications
  /api/v1/admin/applications/{id}:
    delete:
      description: Soft-deletes an application. Its client_id is immediately rejected
        on login and register.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deactivate application
      tags:
      - admin-applications
  /api/v1/admin/audit-logs:
    get:
      description: Returns paginated audit events scoped to the caller's tenant. Requires
        admin:access.
      parameters:
      - description: Filter by action (e.g. auth.login)
        in: query
        name: action
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: From datetime (RFC3339, e.g. 2026-01-01T00:00:00Z)
        in: query
        name: from
        type: string
      - description: To datetime (RFC3339)
        in: query
        name: to
        type: string
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audit.LogsPage'
      security:
      - BearerAuth: []
      summary: Tenant audit log
      tags:
      - admin-audit
  /api/v1/admin/audit-logs/system:
    get:
      description: Returns paginated audit events across ALL tenants. Requires tenant:manage
        (super_admin only).
      parameters:
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: From datetime (RFC3339)
        in: query
        name: from
        type: string
      - description: To datetime (RFC3339)
        in: query
        name: to
        type: string
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audit.LogsPage'
      security:
      - BearerAuth: []
      summary: System-wide audit log
      tags:
      - admin-audit
  /api/v1/admin/permissions:
    get:
      description: Returns all permissions for the caller's tenant. Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.PermissionResult'
            type: array
      security:
      - BearerAuth: []
      summary: List permissions
      tags:
      - admin-rbac
    post:
      consumes:
      - application/json
      description: Creates a new permission within the caller's tenant. Requires admin:access.
      parameters:
      - description: Permission details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.PermissionResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Permission name already exists in this tenant
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create permission
      tags:
      - admin-rbac
  /api/v1/admin/permissions/{id}:
    delete:
      description: Deletes a permission from the caller's tenant. Cascades to roles
        and users. Requires admin:access.
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete permission
      tags:
      - admin-rbac
  /api/v1/admin/roles:
    get:
      description: Returns all roles in the caller's tenant with their permission
        lists. Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.RoleResult'
            type: array
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - admin-rbac
    post:
      consumes:
      - application/json
      description: Creates a role in the caller's tenant with optional permission
        assignments. Requires admin:access.
      parameters:
      - description: Role details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.RoleResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Role name already exists
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create role
      tags:
      - admin-rbac
  /api/v1/admin/roles/{id}:
    delete:
      description: Deletes a non-system role from the tenant. Users assigned this
        role will have their role cleared. Requires admin:access.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete role
      tags:
      - admin-rbac
  /api/v1/admin/roles/{id}/permissions:
    put:
      consumes:
      - application/json
      description: Replaces the permission set on a role. Requires admin:access.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Permission IDs to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateRolePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update role permissions
      tags:
      - admin-rbac
  /api/v1/admin/tenants:
    get:
      description: Returns a paginated, filtered list of tenants. Requires tenant:manage
        permission.
      parameters:
      - description: Search by name, display name, or domain
        in: query
        name: search
        type: string
      - description: 'Filter by status: active or inactive'
        in: query
        name: status
        type: string
      - description: Filter by region (exact match)
        in: query
        name: region
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Rows per page (default 25, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.TenantsPage'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List tenants
      tags:
      - admin-tenants
    post:
      consumes:
      - application/json
      description: Creates a new isolated tenant. Requires tenant:manage permission
        (super_admin only).
      parameters:
      - description: Tenant details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.TenantResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Slug already taken
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create tenant
      tags:
      - admin-tenants
  /api/v1/admin/tenants/{id}:
    delete:
      description: Soft-deactivates a tenant (sets is_active=false). Requires tenant:manage
        permission.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deactivate tenant
      tags:
      - admin-tenants
    get:
      description: Returns a single tenant by ID. Requires tenant:manage permission.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.TenantResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get tenant
      tags:
      - admin-tenants
    put:
      consumes:
      - application/json
      description: Updates editable fields on a tenant. Requires tenant:manage permission.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.TenantResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update tenant
      tags:
      - admin-tenants
  /api/v1/admin/tenants/{id}/activate:
    put:
      description: Sets is_active=true for a previously deactivated tenant. Requires
        tenant:manage permission.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.TenantResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Tenant already active
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Activate tenant
      tags:
      - admin-tenants
  /api/v1/admin/tenants/{id}/cors-origins:
    put:
      consumes:
      - application/json
      description: Replaces the list of allowed CORS origins for a tenant. Pass an
        empty array to disable CORS enforcement. Requires tenant:manage.
      parameters:
      - description: Tenant ID
        in: path
        name: id
        required: true
        type: string
      - description: Allowed origins
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateCORSOriginsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update tenant CORS origins
      tags:
      - admin-tenants
  /api/v1/admin/tenants/check-slug:
    get:
      description: Returns whether a tenant slug is available. Always responds 200.
        Requires tenant:manage permission.
      parameters:
      - description: Slug to check
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SlugCheckResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Check slug availability
      tags:
      - admin-tenants
  /api/v1/admin/tenants/stats:
    get:
      description: Returns system-wide tenant, application, and user counts with month-over-month
        deltas. Requires tenant:manage permission.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.TenantDashboardStats'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tenant dashboard stats
      tags:
      - admin-tenants
  /api/v1/admin/users:
    get:
      description: Returns a paginated, searchable list of users in the caller's tenant.
        Requires admin:access.
      parameters:
      - description: Search by email, first name, or last name
        in: query
        name: search
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UsersPage'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - admin-users
    post:
      consumes:
      - application/json
      description: Creates a user in the caller's tenant with an optional role. Requires
        admin:access.
      parameters:
      - description: User details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.UserResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - admin-users
  /api/v1/admin/users/{id}:
    delete:
      description: Soft-deletes a user (is_deleted=true, is_active=false). ID preserved
        for audit. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - admin-users
    get:
      description: Returns a user's details. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserResult'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user
      tags:
      - admin-users
    put:
      consumes:
      - application/json
      description: Updates a user's profile (email, name). Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - admin-users
  /api/v1/admin/users/{id}/force-password-reset:
    post:
      description: Sends a password reset email to the specified user. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Force password reset
      tags:
      - admin-users
  /api/v1/admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Sets the user's role within the tenant. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role ID to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign role to user
      tags:
      - admin-users
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a reset link to the email address. ALWAYS returns 200 regardless
        of whether the email is registered (prevents email enumeration).
      parameters:
      - description: Tenant slug
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - AUTH
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an existing user and returns a JWT access token +
        refresh token pair.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - AUTH
  /api/v1/auth/login/otp:
    post:
      consumes:
      - application/json
      description: Submit the TOTP code (or backup code) to complete a two-step login.
      parameters:
      - description: OTP session token + TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete TOTP login
      tags:
      - AUTH
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the supplied refresh token. Idempotent — calling twice
        is safe.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - AUTH
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user's profile decoded from the JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - AUTH
  /api/v1/auth/otp:
    delete:
      consumes:
      - application/json
      description: Disables TOTP for the current user. Requires a valid TOTP code
        or backup code.
      parameters:
      - description: Current TOTP or backup code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TOTPDisableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disable TOTP 2FA
      tags:
      - AUTH
  /api/v1/auth/otp/activate:
    post:
      consumes:
      - application/json
      description: Verifies the first TOTP code and marks the enrollment active.
      parameters:
      - description: First TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TOTPActivateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Activate TOTP 2FA
      tags:
      - AUTH
  /api/v1/auth/otp/enroll:
    post:
      description: Generates a TOTP secret and returns an otpauth:// URI plus backup
        codes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EnrollResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Enroll in TOTP 2FA
      tags:
      - AUTH
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Issues a new access + refresh token pair and immediately invalidates
        the old refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh token rotation
      tags:
      - AUTH
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user account in the specified tenant and returns a token
        pair.
      parameters:
      - description: Tenant slug (e.g. emc)
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Tenant not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - AUTH
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Validates the reset token, updates the user's password, and revokes
        all active refresh tokens.
      parameters:
      - description: Token + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - AUTH
  /api/v1/auth/session:
    post:
      consumes:
      - application/json
      description: Authenticates the user and stores tokens in HttpOnly SameSite=Lax
        cookies.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SessionLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie-based login
      tags:
      - auth-session
  /api/v1/auth/session/logout:
    post:
      description: Revokes the refresh token stored in the cookie and clears both
        auth cookies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie session logout
      tags:
      - auth-session
  /api/v1/auth/session/refresh:
    post:
      description: Rotates the access and refresh tokens using the refresh cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie session refresh
      tags:
      - auth-session
  /api/v1/auth/token:
    post:
      consumes:
      - application/json
      description: Issues a service-level access token using client_id + client_secret.
        No user involved, no refresh token issued.
      parameters:
      - description: Client credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Client credentials token
      tags:
      - AUTH
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer <your_access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
