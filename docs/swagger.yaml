      parameters:
      - description: Target tenant ID
        in: path
        name: tid
        required: true
        type: string
      - description: Permission ID
        in: path
        name: pid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete permission from a target tenant
      tags:
      - admin-cross-tenant
  /api/v1/tenants/{tid}/roles:
    get:
      description: Returns all roles (with permissions) belonging to the specified
