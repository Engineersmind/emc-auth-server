      - admin-users
    post:
      consumes:
      - application/json
      description: Creates a user in the caller's tenant with an optional role. Requires
        admin:access.
      parameters:
      - description: User details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
