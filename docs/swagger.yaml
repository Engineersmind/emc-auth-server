      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Activate TOTP 2FA
      tags:
      - AUTH
  /api/v1/auth/otp/backup-codes:
    post:
      consumes:
      - application/json
      description: Replaces all remaining backup codes with a fresh set of 8 WITHOUT
        rotating the TOTP secret — the authenticator app keeps working. Requires a
        valid current TOTP or backup code. Every previous backup code is invalidated;
        the new plaintext codes are shown exactly once.
      parameters:
      - description: Current TOTP or backup code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TOTPRegenerateCodesRequest'
