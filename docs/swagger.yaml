  /api/v1/applications/{appID}/mfa:
    get:
      description: Returns the application's MFA mode (disabled|optional|required;
        no explicit policy = optional) plus enrollment stats over the application's
        own user base.
      parameters:
      - description: Application ID
        in: path
        name: appID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MFAPolicy'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Application not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get application MFA policy
      tags:
      - admin-applications
    put:
      consumes:
      - application/json
      description: Sets the application's MFA mode and (optionally) its allowed methods.
        'required' forces enrollment in an allowed method at the next login of every
        not-yet-enrolled user; 'disabled' rejects new enrollments (already-active
        enrollments still gate login until an admin resets them); 'optional' restores
        the default opt-in behaviour. allowed_methods omitted keeps the current set
        (default ["totp"]).
      parameters:
      - description: Application ID
        in: path
        name: appID
        required: true
        type: string
      - description: MFA mode (disabled | optional | required) + optional allowed_methods
          subset of [totp, email]
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateApplicationMFARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MFAPolicy'
        "400":
          description: Invalid mode
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Application not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set application MFA policy
      tags:
      - admin-applications
  /api/v1/applications/{appID}/roles:
