    post:
      consumes:
      - application/json
      description: 'Authenticates a user that belongs to the authenticated application''s
        own user base — invisible to POST /auth/login and to every other application.
        Application credentials via Authorization: Basic header only.'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AppLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid application or user credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login an end user via application credentials
      tags:
      - AUTH
  /api/v1/auth/apps/login/magic:
    post:
      consumes:
      - application/json
      description: Emails a single-use, 15-minute sign-in link to the account address
        if it exists in the application's user base. Always returns success for unknown
        emails (no account enumeration). Requires magic-link sign-in to be enabled
        on the application's auth policy.
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MagicLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid application credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Magic link not enabled for this application
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request a magic sign-in link
      tags:
      - AUTH
  /api/v1/auth/apps/login/magic/verify:
    post:
      consumes:
      - application/json
      description: 'Consumes the single-use token from the emailed link. The application''s
        MFA policy still applies: the response is a token pair, an OTP challenge (requires_otp),
        or a forced-enrollment challenge (403 mfa_enrollment_required) — exactly like
        a password login.'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: Token from the emailed link
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MagicLinkVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "401":
          description: Invalid application credentials or invalid/expired link
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: MFA enrollment required
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify a magic sign-in link
      tags:
      - AUTH
  /api/v1/auth/apps/register:
    post:
      consumes:
      - application/json
      description: 'Creates a user account owned by the authenticated application
        — the same email may hold independent accounts in different applications.
        Application credentials via Authorization: Basic header only; no tenant slug
        needed.'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AppRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid application credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered in this application
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register an end user via application credentials
      tags:
      - AUTH
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a reset link to the email address. ALWAYS returns 200 regardless
        of whether the email is registered (prevents email enumeration).
      parameters:
      - description: Tenant slug
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - AUTH
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an existing user by email and password only. The
        tenant is resolved automatically from which account the password matches —
        no tenant slug or header is required.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - AUTH
  /api/v1/auth/login/mfa/activate:
    post:
      consumes:
      - application/json
      description: Verifies the first TOTP code for a pending enrollment, marks MFA
        active, and completes the login in the same step — the response carries the
        token pair. 5 incorrect codes invalidate the enrollment session.
      parameters:
      - description: Enrollment token + first TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MFAActivateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid code or expired enrollment token
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Attempt budget exhausted — restart login
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Activate forced MFA enrollment and complete login
      tags:
      - AUTH
  /api/v1/auth/login/mfa/email:
    post:
      consumes:
      - application/json
      description: Sends a one-time code to the pending account's inbox for a login
        against a 'required'-MFA application. Submitting that code to /auth/login/mfa/activate
        enrolls the user in email MFA and completes the login. Available only when
        the application's allowed_methods include "email".
      parameters:
      - description: Enrollment token from the login response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MFAEmailPendingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired enrollment token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Email method not allowed for this application
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Re-send budget exhausted
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Begin forced MFA enrollment via email
      tags:
      - AUTH
  /api/v1/auth/login/mfa/enroll:
    post:
      consumes:
      - application/json
      description: Exchanges the enrollment token returned by a login against a 'required'-MFA
        application for a TOTP secret (otpauth:// URI + backup codes). The token authorizes
        only this call and /auth/login/mfa/activate; no JWT is issued until activation
        completes.
      parameters:
      - description: Enrollment token from the login response
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MFAEnrollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EnrollResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired enrollment token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Begin forced MFA enrollment
      tags:
      - AUTH
  /api/v1/auth/login/otp:
    post:
      consumes:
      - application/json
      description: Submit the TOTP code (or backup code) to complete a two-step login.
        The session allows 5 incorrect codes before it is invalidated. Returns the
        full token pair (and sets auth cookies for browser clients).
      parameters:
      - description: OTP session token + TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Attempt budget exhausted — restart login
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete TOTP login
      tags:
      - AUTH
  /api/v1/auth/login/otp/resend:
    post:
      consumes:
      - application/json
      description: Re-sends the one-time email code for an open OTP challenge (max
        3 re-sends per challenge). Only available when the challenge's methods include
        "email".
      parameters:
      - description: OTP session token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginOTPResendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired session
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Re-send budget exhausted
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend login email code
      tags:
      - AUTH
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the supplied refresh token. Idempotent — calling twice
        is safe.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - AUTH
  /api/v1/auth/management-token:
    post:
      description: 'Authenticates an API key (X-API-Key or Authorization: ApiKey)
        and returns a short-lived management JWT valid for 15 minutes. Use the returned
        token as Bearer auth on admin endpoints.'
      parameters:
      - description: 'API key (emck_…). Alternative: Authorization: ApiKey <key>'
        in: header
        name: X-API-Key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: access_token, expires_in, token_type
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Management tokens not configured
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exchange API key for management JWT
      tags:
      - AUTH
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user's profile decoded from the JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - AUTH
  /api/v1/auth/my-activity:
    get:
      description: Returns the authenticated user's own recent audit log entries.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Rows per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audit.LogsPage'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: My activity log
      tags:
      - AUTH
  /api/v1/auth/oauth/exchange:
    post:
      consumes:
      - application/json
      description: Consumes the single-use login_code issued by the social login callback
        and returns the standard access + refresh token pair.
      parameters:
      - description: client_id + login_code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.OAuthExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exchange social login code for tokens
      tags:
      - oauth
  /api/v1/auth/otp:
    delete:
      consumes:
      - application/json
      description: Disables TOTP for the current user. Requires a valid TOTP code
        or backup code. Rejected when the user's application has MFA mode 'required'
        — users cannot opt out of a mandated policy.
      parameters:
      - description: Current TOTP or backup code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TOTPDisableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: MFA is required by the application's policy
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disable TOTP 2FA
      tags:
      - AUTH
  /api/v1/auth/otp/activate:
    post:
      consumes:
      - application/json
      description: Verifies the first TOTP code and marks the enrollment active.
      parameters:
      - description: First TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TOTPActivateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Activate TOTP 2FA
      tags:
      - AUTH
  /api/v1/auth/otp/backup-codes:
    post:
      consumes:
      - application/json
      description: Replaces all remaining backup codes with a fresh set of 8 WITHOUT
        rotating the TOTP secret — the authenticator app keeps working. Requires a
        valid current TOTP or backup code. Every previous backup code is invalidated;
        the new plaintext codes are shown exactly once.
      parameters:
      - description: Current TOTP or backup code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TOTPRegenerateCodesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Missing or invalid proof code
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Regenerate backup codes
      tags:
      - AUTH
  /api/v1/auth/otp/email:
    delete:
      consumes:
      - application/json
      description: Disables email MFA for the current user. Requires a fresh emailed
        code (request one via POST /auth/otp/email/send). Rejected when it is the
        user's last second factor under a 'required' application policy.
      parameters:
      - description: Emailed verification code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.EmailMFACodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired code
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: MFA is required by the application's policy
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disable email MFA
      tags:
      - AUTH
  /api/v1/auth/otp/email/activate:
    post:
      consumes:
      - application/json
      description: Verifies the emailed code and marks email MFA active. From then
        on, logins are challenged with a one-time code sent to the account's inbox.
      parameters:
      - description: Emailed verification code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.EmailMFACodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired code
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Attempt budget exhausted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Activate email MFA
      tags:
      - AUTH
  /api/v1/auth/otp/email/enroll:
    post:
      description: 'Starts email-OTP enrollment: sends a verification code to the
        account''s email address. Activate with POST /auth/otp/email/activate. Rejected
        when the application''s MFA mode is ''disabled'' or its policy does not allow
        the email method.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: MFA disabled or email method not allowed for this application
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Enroll in email MFA
      tags:
      - AUTH
  /api/v1/auth/otp/email/send:
    post:
      description: Sends a fresh one-time code to the account's inbox for an already-active
        email MFA enrollment — used as proof for self-service actions such as disabling
        email MFA.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Email MFA not active
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send an email MFA verification code
      tags:
      - AUTH
  /api/v1/auth/otp/enroll:
    post:
      consumes:
      - application/json
      description: Generates a TOTP secret and returns an otpauth:// URI plus backup
        codes. The authenticator issuer is the owning application's name for application-scoped
        users. Rejected when the application's MFA mode is 'disabled'. Re-enrolling
        while active requires a valid current TOTP or backup code in the body.
      parameters:
      - description: Current code (required only when re-enrolling)
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.TOTPEnrollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EnrollResult'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: MFA disabled for this application, or missing re-enrollment
            proof
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Enroll in TOTP 2FA
      tags:
      - AUTH
  /api/v1/auth/otp/status:
    get:
      description: Returns the authenticated user's TOTP enrollment state and how
        many single-use backup codes remain — clients should prompt regeneration when
        the count runs low.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TOTPStatus'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get own MFA status
      tags:
      - AUTH
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Issues a new access + refresh token pair and immediately invalidates
        the old refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh token rotation
      tags:
      - AUTH
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user account in the specified tenant and returns a token
        pair.
      parameters:
      - description: Tenant slug (e.g. emc)
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Tenant not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - AUTH
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Validates the reset token, updates the user's password, and revokes
        all active refresh tokens.
      parameters:
      - description: Token + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - AUTH
  /api/v1/auth/session:
    post:
      consumes:
      - application/json
      description: Authenticates the user by email and password only, and stores tokens
        in HttpOnly SameSite=Lax cookies. The tenant is resolved automatically — no
        tenant slug or header is required.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SessionLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie-based login
      tags:
      - auth-session
  /api/v1/auth/session/logout:
    post:
      description: Revokes the refresh token stored in the cookie and clears both
        auth cookies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie session logout
      tags:
      - auth-session
  /api/v1/auth/session/refresh:
    post:
      description: Rotates the access and refresh tokens using the refresh cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie session refresh
      tags:
      - auth-session
  /api/v1/auth/token:
    post:
      consumes:
      - application/json
      description: 'Issues a service-level access token. Credentials via Authorization:
        Basic base64(client_id:client_secret) header only. No user involved, no refresh
        token issued.'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: grant_type only
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Client credentials token
      tags:
      - AUTH
  /api/v1/email-settings:
    delete:
      description: Removes the white-label sender at this scope; sends fall back to
        the next level (application → tenant → global).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No sender configured at this scope
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete email sender settings
      tags:
      - admin-email-senders
    get:
      description: Returns the white-label sender configured for the tenant (or one
        application). The SMTP password is never returned — has_password reports whether
        one is stored. 404 = no sender at this scope (the global server sender applies).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EmailSenderSettings'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No sender configured at this scope
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get email sender settings
      tags:
      - admin-email-senders
    put:
      consumes:
      - application/json
      description: Creates or updates the white-label sender for the tenant (or one
        application). MFA code emails then go out From this address via this SMTP
        relay, with priority application → tenant → global; a relay failure falls
        back to the global sender. The SMTP password is stored encrypted (AES-256-GCM);
        omit it on update to keep the current one. The owner is responsible for SPF/DKIM
        on the sending domain.
      parameters:
      - description: Sender settings (from_address + smtp_host required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpsertEmailSenderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EmailSenderSettings'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set email sender settings
      tags:
      - admin-email-senders
