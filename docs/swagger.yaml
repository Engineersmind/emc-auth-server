  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - system
  /saml/acs:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Receives IdP SAMLResponse. Currently returns 501 â€” disabled until
        IdP XML signature verification is implemented.
      produces:
      - application/json
      responses:
        "501":
          description: Not yet implemented
          schema:
            additionalProperties:
              type: string
            type: object
      summary: SAML Assertion Consumer Service (disabled)
      tags:
      - saml
  /saml/login:
    get:
      description: Redirects the browser to the configured IdP with a signed SAMLRequest.
      parameters:
      - description: Tenant ID
        in: query
        name: tenant
        required: true
        type: string
      responses:
        "302":
          description: Redirect to IdP
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Initiate SP-initiated SAML SSO
      tags:
      - saml
  /saml/metadata:
    get:
      description: Returns SAML Service Provider metadata XML for the given tenant.
        Used by IdPs to configure the SP.
      parameters:
      - description: Tenant ID
        in: query
        name: tenant
        required: true
        type: string
      produces:
      - application/xml
      responses:
        "200":
          description: SP metadata XML
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get SP metadata XML
      tags:
      - saml
securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer <your_access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
