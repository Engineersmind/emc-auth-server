      - BearerAuth: []
      summary: Tenant dashboard stats
      tags:
      - admin-tenants
  /api/v1/users:
    get:
      description: Returns a paginated, searchable list of users in the caller's tenant.
        Requires admin:access.
      parameters:
      - description: Search by email, first name, or last name
        in: query
        name: search
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
