    post:
      consumes:
      - application/json
      description: Adds a new permission to the specified tenant. Requires tenant:manage
        permission.
      parameters:
      - description: Target tenant ID
        in: path
        name: tid
        required: true
        type: string
      - description: Permission details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.PermissionResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Permission name already exists
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create permission in a target tenant
      tags:
      - admin-cross-tenant
  /api/v1/tenants/{tid}/permissions/{pid}:
    delete:
      description: Removes a permission from the specified tenant. Requires tenant:manage
