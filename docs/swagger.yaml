host: localhost:8082
info:
  contact:
    name: EngineersMind
    url: https://github.com/engineersmind/emc-auth-server
  description: Standalone multi-tenant Identity Provider — email/password auth, JWT,
    refresh tokens, TOTP 2FA, SAML 2.0, RBAC, Admin UI, and AI/Agent security.
  license:
    name: MIT
  title: EMC Auth Server
  version: 1.5.0
paths:
  /api/v1/agents:
    get:
      description: Returns all active agent registrations for the requesting tenant.
        Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.AgentWithStats'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List agent registrations
      tags:
      - agent-management
    post:
      consumes:
      - application/json
      description: Creates an agent registration and returns the raw API key once.
        Requires admin:access.
      parameters:
      - description: Agent details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AgentRegistrationResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a new agent
      tags:
      - agent-management
  /api/v1/agents/{id}:
    delete:
      description: Revokes an agent registration belonging to the requesting tenant.
        Requires admin:access.
      parameters:
      - description: Agent UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an agent registration
      tags:
      - agent-management
  /api/v1/agents/analysis:
    get:
      description: Returns risk-scored analysis for all active agents in the tenant.
        Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AgentAnalysis'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get 24h agent risk analysis
      tags:
      - agent-management
  /api/v1/agents/authenticate:
    post:
      consumes:
      - application/json
      description: Validates an agent API key and returns a signed short-lived JWT.
        Public — no prior auth required.
      parameters:
      - description: Agent key and tenant ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthenticateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate an agent and issue a JWT
      tags:
      - agent-auth
  /api/v1/api-keys:
    get:
      description: Returns all active API keys for the caller's tenant. The raw key
        is never included.
      produces:
      - application/json
      responses:
        "200":
          description: OK
