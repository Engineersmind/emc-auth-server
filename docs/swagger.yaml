      - admin-cross-tenant
    post:
      consumes:
      - application/json
      description: Creates a role and optionally assigns permissions to it. Requires
        tenant:manage permission.
      parameters:
      - description: Target tenant ID
        in: path
        name: tid
        required: true
        type: string
      - description: Role details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.RoleResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Role name already exists
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create role in a target tenant
      tags:
      - admin-cross-tenant
  /api/v1/tenants/{tid}/roles/{rid}:
    delete:
      description: Permanently deletes a role from the target tenant. Requires tenant:manage.
      parameters:
      - description: Target tenant ID
        in: path
        name: tid
        required: true
        type: string
      - description: Role ID
        in: path
        name: rid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a role from a target tenant
      tags:
      - admin-cross-tenant
  /api/v1/tenants/{tid}/roles/{rid}/permissions:
    put:
      consumes:
      - application/json
      description: Replaces the full permission set on a role in the target tenant.
        Requires tenant:manage.
      parameters:
      - description: Target tenant ID
        in: path
        name: tid
        required: true
        type: string
      - description: Role ID
        in: path
        name: rid
        required: true
        type: string
      - description: Permission IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateRolePermissionsRequest'
