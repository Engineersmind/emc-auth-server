      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20)
        in: query
        name: limit
        type: integer
      - description: Search by email or name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.UserResult'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users in a target tenant
      tags:
      - admin-cross-tenant
    post:
      consumes:
      - application/json
      description: Creates a new user in the specified tenant. Requires tenant:manage.
      parameters:
      - description: Target tenant ID
        in: path
        name: tid
        required: true
        type: string
      - description: User details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.UserResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a user in a target tenant
      tags:
      - admin-cross-tenant
  /api/v1/tenants/{tid}/users/{uid}:
    delete:
      description: Marks the user as deleted (is_deleted=true). Requires tenant:manage.
      parameters:
      - description: Target tenant ID
        in: path
        name: tid
        required: true
        type: string
      - description: User ID
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Soft-delete a user from a target tenant
      tags:
      - admin-cross-tenant
  /api/v1/tenants/check-slug:
    get:
      description: Returns whether a tenant slug is available. Always responds 200.
        Requires tenant:manage permission.
      parameters:
      - description: Slug to check
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SlugCheckResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
