      tags:
      - admin-users
  /api/v1/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Sets the user's role within the tenant. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role ID to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
