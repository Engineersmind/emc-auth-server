  /api/v1/auth/otp/status:
    get:
      description: Returns the authenticated user's TOTP enrollment state and how
        many single-use backup codes remain — clients should prompt regeneration when
        the count runs low.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TOTPStatus'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get own MFA status
      tags:
      - AUTH
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Issues a new access + refresh token pair and immediately invalidates the old refresh token.
        Delivery depends on the identity behind the presented refresh token:
        application-scoped sessions (those established through /auth/apps/login, /auth/apps/register or magic-link verify — their access token carries an `app_id` claim) receive the full pair in the JSON body (`access_token`, `refresh_token`, `token_type`, `expires_in`, `expires_at`) and no cookies, matching the shape /auth/apps/login already returns;
        first-party sessions receive the pair as HttpOnly cookies and a body of `{message, expires_in, expires_at}` only — a refresh token is deliberately never placed where browser JavaScript can read it.
        Body-based (mobile/API) clients must handle two additional responses that the cookie flow absorbs transparently:
        409 (`concurrent_refresh`) means a sibling request already rotated this token family within the grace window — this response carries NO token pair; the client should use the in-flight sibling's response rather than treating 409 as an error.
        503 means the session store (Redis) is temporarily unavailable — the client should retry.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: concurrent_refresh — sibling request already rotated the family;
            no token pair returned
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: session store unavailable — retry
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh token rotation
      tags:
      - AUTH
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user account in the specified tenant. Does NOT sign the
        user in — no session is created and no tokens are returned; call /auth/session
        or /auth/login afterwards.
      parameters:
      - description: Tenant slug (e.g. emc)
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Tenant not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - AUTH
  /api/v1/auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Re-sends the email-verification link for an unverified tenant-level
        user. Always returns 200 to prevent account enumeration.
      parameters:
      - description: Tenant slug
        in: header
        name: X-Tenant-Slug
        required: true
        type: string
      - description: Email to resend to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend verification email
      tags:
      - AUTH
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Validates the reset token, updates the user's password, and revokes
        all active refresh tokens.
      parameters:
      - description: Token + new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - AUTH
  /api/v1/auth/session:
    post:
      consumes:
      - application/json
      description: Authenticates the user by email and password only, and stores tokens
        in HttpOnly SameSite=Lax cookies. The tenant is resolved automatically — no
        tenant slug or header is required.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SessionLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie-based login
      tags:
      - auth-session
  /api/v1/auth/session/logout:
    post:
      description: Revokes the refresh token stored in the cookie and clears both
        auth cookies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie session logout
      tags:
      - auth-session
  /api/v1/auth/session/refresh:
    post:
      description: |-
        Rotates the access and refresh tokens using the refresh cookie.
        409 (`concurrent_refresh`) signals a sibling request already rotated the family within the grace window (the fresh cookies are on that sibling's response); 503 signals the session store (Redis) is temporarily unavailable — retry.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: concurrent_refresh — sibling request already rotated the family
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: session store unavailable — retry
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cookie session refresh
      tags:
      - auth-session
  /api/v1/auth/token:
    post:
      consumes:
      - application/json
      description: 'Issues a service-level access token. Credentials via Authorization:
        Basic base64(client_id:client_secret) header only. No user involved, no refresh
        token issued.'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: grant_type only
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Client credentials token
      tags:
      - AUTH
  /api/v1/auth/unblock-account:
    get:
      description: Lifts an automatic failed-attempt lockout using the token from
        the blocked-account email. Single-use. Admin blocks cannot be lifted this
        way.
      parameters:
      - description: Unblock token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Unblock an account
      tags:
      - AUTH
  /api/v1/auth/verify-email:
    get:
      description: Confirms ownership of an email address via the token from the verification
        link. Single-use.
      parameters:
      - description: Verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify email address
      tags:
      - AUTH
  /api/v1/email-settings:
    delete:
      description: Removes the white-label sender at this scope; sends fall back to
        the next level (application → tenant → global).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No sender configured at this scope
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete email sender settings
      tags:
      - admin-email-senders
    get:
      description: Returns the white-label sender configured for the tenant (or one
        application). The SMTP password is never returned — has_password reports whether
        one is stored. 404 = no sender at this scope (the global server sender applies).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EmailSenderSettings'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No sender configured at this scope
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get email sender settings
      tags:
      - admin-email-senders
    put:
      consumes:
      - application/json
      description: Creates or updates the white-label sender for the tenant (or one
        application). MFA code emails then go out From this address via this SMTP
        relay, with priority application → tenant → global; a relay failure falls
        back to the global sender. The SMTP password is stored encrypted (AES-256-GCM);
        omit it on update to keep the current one. The owner is responsible for SPF/DKIM
        on the sending domain.
      parameters:
      - description: Sender settings (from_address + smtp_host required)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpsertEmailSenderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EmailSenderSettings'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set email sender settings
      tags:
      - admin-email-senders
  /api/v1/email-settings/test:
    post:
      consumes:
      - application/json
      description: Sends a sample email using the sender configured at this scope
        and the chosen template type, so an admin can confirm the SMTP/SendGrid configuration
        delivers mail. The response reports which scope and provider handled the send.
        Recipient defaults to the requesting admin's own address; any valid address
        may be supplied (rate-limited, and audited with the recipient). Returns 409
        when this scope has no sender of its own — pass allow_inherited=true to deliberately
        test the inherited (tenant or platform) sender instead.
      parameters:
      - description: Recipient, template type, allow_inherited
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.SendTestEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SendTestEmailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: This scope has no sender of its own
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Delivery failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send a test email
      tags:
      - admin-email-senders
  /api/v1/email-templates:
    get:
      description: Returns every customizable email template at this scope. Rows with
        is_default=true are the built-in defaults (no override stored).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.EmailTemplate'
            type: array
      security:
      - BearerAuth: []
      summary: List email templates
      tags:
      - admin-email-templates
  /api/v1/email-templates/{type}:
    delete:
      description: Removes the template override at this scope; sends revert to the
        next level (application → tenant → built-in default).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No override configured at this scope
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an email template
      tags:
      - admin-email-templates
    get:
      description: Returns the stored template for a type, or the built-in default
        (is_default=true) when none is configured.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EmailTemplate'
        "400":
          description: Unknown template type
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get one email template
      tags:
      - admin-email-templates
    put:
      consumes:
      - application/json
      description: Creates or updates the template for a type at this scope. subject/html_body/text_body
        are Go-template source with variables like {{.Link}}, {{.Code}}, {{.ProductName}},
        {{.AppName}}, {{.TTLMinutes}}. Invalid template syntax is rejected.
      parameters:
      - description: Template content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpsertEmailTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.EmailTemplate'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set an email template
      tags:
      - admin-email-templates
  /api/v1/me/sessions:
    delete:
      description: Ends every session except the one this request came from.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Sign out your other sessions
      tags:
      - account
    get:
      description: Returns the caller's active sessions with device, IP, and last-activity,
        marking the session the request came from.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List your own active sessions
      tags:
      - account
  /api/v1/me/sessions/{familyID}:
    delete:
      description: Ends a single session belonging to the caller. Use the logout endpoint
        to end the current session.
      parameters:
      - description: Session ID
        in: path
        name: familyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Sign out one of your own sessions
      tags:
      - account
  /api/v1/permissions:
    get:
      description: Returns all permissions for the caller's tenant. Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.PermissionResult'
            type: array
      security:
      - BearerAuth: []
      summary: List permissions
      tags:
      - admin-rbac
    post:
      consumes:
      - application/json
      description: Creates a new permission within the caller's tenant. Requires admin:access.
      parameters:
      - description: Permission details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.PermissionResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Permission name already exists in this tenant
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create permission
      tags:
      - admin-rbac
  /api/v1/permissions/{id}:
    delete:
      description: Deletes a permission from the caller's tenant. Cascades to roles
        and users. Requires admin:access.
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete permission
      tags:
      - admin-rbac
    put:
      consumes:
      - application/json
      description: Renames a permission and/or replaces its description. Empty name
        keeps the current one. Requires admin:access.
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.PermissionResult'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Permission name already exists
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update permission
      tags:
      - admin-rbac
  /api/v1/roles:
    get:
      description: Returns all roles in the caller's tenant with their permission
        lists. Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.RoleResult'
            type: array
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - admin-rbac
    post:
      consumes:
      - application/json
      description: Creates a role in the caller's tenant with optional permission
        assignments. Requires admin:access.
      parameters:
      - description: Role details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.RoleResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Role name already exists
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create role
      tags:
      - admin-rbac
  /api/v1/roles/{id}:
    delete:
      description: Deletes a non-system role from the tenant. Users assigned this
        role will have their role cleared. Requires admin:access.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete role
      tags:
      - admin-rbac
  /api/v1/roles/{id}/permissions:
    put:
      consumes:
      - application/json
      description: Replaces the permission set on a role. Requires admin:access.
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Permission IDs to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateRolePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update role permissions
      tags:
      - admin-rbac
  /api/v1/saml-config:
    get:
      description: Returns the SAML IdP configuration for the requesting tenant. Requires
        admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/saml.SAMLConfig'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get tenant SAML configuration
      tags:
      - saml
    put:
      consumes:
      - application/json
      description: Upserts the SAML IdP configuration for the requesting tenant. Requires
        admin:access.
      parameters:
      - description: SAML config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/saml.SAMLConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/saml.SAMLConfig'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create or update tenant SAML configuration
      tags:
      - saml
  /api/v1/session-policy:
    delete:
      description: Removes this scope's policy override so it inherits from the tenant
        or platform default. Requires apps:write (apps:read to view).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reset the session lifetime policy
      tags:
      - admin-sessions
    get:
      description: Returns the session policy in force for the tenant or application,
        and whether it is inherited. Requires apps:write (apps:read to view).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SessionPolicyView'
      security:
      - BearerAuth: []
      summary: Get the session lifetime policy
      tags:
      - admin-sessions
    put:
      consumes:
      - application/json
      description: Sets idle/absolute session lifetimes, the concurrent-session cap,
        and whether "remember me" is allowed. Omitted fields are left unchanged. Requires
        apps:write (apps:read to view).
      parameters:
      - description: Policy fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.SessionPolicyInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SessionPolicyView'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update the session lifetime policy
      tags:
      - admin-sessions
  /api/v1/signing-keys:
    get:
      description: Public metadata for the tenant's signing keys. Never returns private
        key material.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SigningKeyListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List this tenant's JWT signing keys
      tags:
      - admin
  /api/v1/signing-keys/complete:
    post:
      description: Activates the prepared key and retires the current one. The retired
        public key stays published until its grace window elapses, so no live token
        breaks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SigningKeyListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Complete a signing-key rotation
      tags:
      - admin
  /api/v1/signing-keys/prepare:
    post:
      description: Generates and publishes the next signing key without activating
        it. Wait for verifier caches to pick it up (see Cache-Control on the JWKS
        endpoint), then call the complete endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SigningKeyListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
