  /api/v1/tenants/{tid}/admins:
    get:
      description: Returns the tenant's owners and co-owners. An owner's applications
        array is empty because they administer every application in the tenant, present
        and future — read it together with role. status is "pending_invitation" until
        the invitation is accepted and the address verified.
      parameters:
      - description: Tenant ID
        in: path
        name: tid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.TenantAdminResult'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List tenant administrators
      tags:
      - admin-tenant-admins
    post:
      consumes:
      - application/json
      description: 'Adds an owner (tenant-wide) or co-owner (specific applications).
        An address that is already a TENANT-LEVEL user is promoted in place and no
        second identity is created; an application-scoped user with the same address
        is unrelated and never collides, so being a customer of an application and
        an administrator of its tenant are compatible. The response''s action field
        reports what happened: "invited" (new account, invitation sent), "grants_added"
        (existing user promoted or widened), or "invitation_resent". An invitation
        that would change nothing returns 409, as does a tenant already holding the
        maximum number of administrators. A repeat resend to the same address within
        a minute returns 429. Returns 503 when the server has no email delivery configured
        — nothing is recorded, because an administrator who cannot be told they are
        one could never sign in.'
      parameters:
      - description: Tenant ID
        in: path
        name: tid
        required: true
        type: integer
      - description: Administrator details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.InviteTenantAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.InviteTenantAdminResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Already an administrator with these grants, or the administrator
            limit is reached
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: An invitation was sent to this address moments ago
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Invitations are not configured; nothing was recorded
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Invite a tenant administrator
      tags:
      - admin-tenant-admins
  /api/v1/tenants/{tid}/admins/{adminID}:
    delete:
      description: 'Withdraws administration and revokes the administrator''s live
        sessions, so a removed administrator cannot keep rotating a refresh token
        into fresh access tokens that still carry their old reach. The user account
        itself survives — losing an administrative role must not take the person''s
        identity or audit history with it. Removing the last owner who can actually
        log in returns 409: a tenant with no usable owner is administrable only by
        a platform admin. Removing a co-owner also returns 409 when they are the tenant''s
        only administrator who can sign in, which happens when the owner never accepted
        their invitation. An administrator who has not yet accepted does not count
        as usable, and removing such a pending administrator is always allowed — they
        could not sign in, so their removal takes nothing away.'
      parameters:
      - description: Tenant ID
        in: path
        name: tid
        required: true
        type: integer
      - description: Administrator ID
        in: path
        name: adminID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Would leave the tenant without an administrator who can sign
            in
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove a tenant administrator
      tags:
      - admin-tenant-admins
  /api/v1/tenants/{tid}/admins/{adminID}/applications:
    put:
      consumes:
      - application/json
      description: 'Sets exactly which applications a co-owner administers. An empty
        list is rejected — grants only ever narrow, so an administrator with none
        could reach nothing; use DELETE to revoke administration outright. Owners
        cannot be granted specific applications: they administer all of them. Every
        live access token for the affected account is invalidated so a revoked grant
        cannot outlive this call.'
      parameters:
      - description: Tenant ID
        in: path
        name: tid
        required: true
        type: integer
      - description: Administrator ID
        in: path
        name: adminID
        required: true
        type: integer
      - description: Application IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SetTenantAdminGrantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.TenantAdminResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Replace a co-owner's application grants
      tags:
      - admin-tenant-admins
