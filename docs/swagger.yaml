            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - admin-users
  /api/v1/users/{id}:
    delete:
      description: Soft-deletes a user (is_deleted=true, is_active=false). ID preserved
        for audit. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - admin-users
    get:
      description: Returns a user's details. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserResult'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user
      tags:
      - admin-users
    put:
      consumes:
      - application/json
      description: Updates a user's profile (email, name). Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - admin-users
  /api/v1/users/{id}/detail:
    get:
      description: Returns a user's profile plus MFA status, linked identities, active-session
        count, and last activity. Requires users:read.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get enriched user detail
      tags:
      - admin-users
  /api/v1/users/{id}/force-password-reset:
    post:
      description: Sends a password reset email to the specified user. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Force password reset
      tags:
      - admin-users
  /api/v1/users/{id}/identities:
    get:
      description: Returns the external identities (Google etc.) linked to one user
        in the caller's tenant. Requires users:read.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.UserIdentityDetail'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a user's linked social identities
      tags:
      - oauth
  /api/v1/users/{id}/identities/{provider}:
    delete:
      description: Removes the provider link. Refused when it is the user's only login
        method (no password and no other identity). Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Provider (google)
        in: path
        name: provider
        required: true
        type: string
      responses:
        "204":
          description: Unlinked
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Unlink a social identity from a user
      tags:
      - oauth
  /api/v1/users/{id}/mfa:
    get:
      description: Returns the user's enrolled MFA methods and remaining backup codes.
        Requires users:read.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserMFAStatus'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a user's MFA status
      tags:
      - admin-users
  /api/v1/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Sets the user's role within the tenant. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role ID to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign role to user
      tags:
      - admin-users
  /api/v1/users/{id}/sessions:
    delete:
      description: Revokes every active session and invalidates issued tokens, signing
        the user out everywhere. Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke all of a user's sessions
      tags:
      - admin-users
    get:
      description: Returns the user's active sessions (one per session family) with
        IP, user agent, and last activity. Requires users:read.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/admin.UserSession'
              type: array
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a user's active sessions
      tags:
      - admin-users
  /api/v1/users/{id}/sessions/{familyID}:
    delete:
      description: Revokes one session family for the user. Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Session family ID
        in: path
        name: familyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke a single user session
      tags:
      - admin-users
  /api/v1/users/{id}/status:
    put:
      consumes:
      - application/json
      description: Sets a user's active status. Blocking (is_active=false) revokes
        all sessions and invalidates issued tokens. Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Desired status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SetUserStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Block or unblock a user
      tags:
      - admin-users
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - system
  /oauth/{provider}/callback:
    get:
      description: Consumes the single-use state, exchanges the code (PKCE), verifies
        the provider ID token, resolves/links/provisions the user, and redirects back
        to the application with a one-time login_code.
      parameters:
      - description: Provider (google)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code from the provider
        in: query
        name: code
        type: string
      - description: Opaque state issued at login start
        in: query
        name: state
        required: true
        type: string
      - description: Provider error (e.g. access_denied)
        in: query
        name: error
        type: string
      responses:
        "302":
          description: Redirect back to the application
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Social login callback
      tags:
      - oauth
  /oauth/{provider}/login:
    get:
      description: Validates the application and redirect target, then redirects the
        browser to the provider's consent screen (Authorization Code + PKCE).
      parameters:
      - description: Provider (google)
        in: path
        name: provider
        required: true
        type: string
      - description: Application client_id
        in: query
        name: client_id
        required: true
        type: string
      - description: Post-login redirect target (must be in the application's allow-list;
          optional when the list has exactly one entry)
        in: query
        name: redirect
        type: string
      responses:
        "302":
          description: Redirect to provider
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start social login
      tags:
      - oauth
  /saml/acs:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Receives IdP SAMLResponse. Currently returns 501 — disabled until
        IdP XML signature verification is implemented.
      produces:
      - application/json
      responses:
        "501":
          description: Not yet implemented
          schema:
            additionalProperties:
              type: string
            type: object
      summary: SAML Assertion Consumer Service (disabled)
      tags:
      - saml
  /saml/login:
    get:
      description: Redirects the browser to the configured IdP with a signed SAMLRequest.
      parameters:
      - description: Tenant ID
        in: query
        name: tenant
        required: true
        type: string
      responses:
        "302":
          description: Redirect to IdP
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Initiate SP-initiated SAML SSO
      tags:
      - saml
  /saml/metadata:
    get:
      description: Returns SAML Service Provider metadata XML for the given tenant.
        Used by IdPs to configure the SP.
      parameters:
      - description: Tenant ID
        in: query
        name: tenant
        required: true
        type: string
      produces:
      - application/xml
      responses:
        "200":
          description: SP metadata XML
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get SP metadata XML
      tags:
      - saml
securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer <your_access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
