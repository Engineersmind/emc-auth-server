        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Missing or invalid proof code
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Regenerate backup codes
      tags:
      - AUTH
  /api/v1/auth/otp/email:
    delete:
      consumes:
      - application/json
      description: Disables email MFA for the current user. Requires a fresh emailed
        code (request one via POST /auth/otp/email/send). Rejected when it is the
        user's last second factor under a 'required' application policy.
      parameters:
      - description: Emailed verification code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.EmailMFACodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired code
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: MFA is required by the application's policy
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disable email MFA
      tags:
      - AUTH
  /api/v1/auth/otp/email/activate:
    post:
      consumes:
      - application/json
      description: Verifies the emailed code and marks email MFA active. From then
        on, logins are challenged with a one-time code sent to the account's inbox.
      parameters:
      - description: Emailed verification code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.EmailMFACodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired code
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Attempt budget exhausted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Activate email MFA
      tags:
      - AUTH
  /api/v1/auth/otp/email/enroll:
    post:
      description: 'Starts email-OTP enrollment: sends a verification code to the
        account''s email address. Activate with POST /auth/otp/email/activate. Rejected
        when the application''s MFA mode is ''disabled'' or its policy does not allow
        the email method.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: MFA disabled or email method not allowed for this application
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Enroll in email MFA
      tags:
      - AUTH
  /api/v1/auth/otp/email/send:
    post:
      description: Sends a fresh one-time code to the account's inbox for an already-active
        email MFA enrollment — used as proof for self-service actions such as disabling
        email MFA.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Email MFA not active
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send an email MFA verification code
      tags:
      - AUTH
  /api/v1/auth/otp/enroll:
    post:
      consumes:
      - application/json
      description: Generates a TOTP secret and returns an otpauth:// URI plus backup
        codes. The authenticator issuer is the owning application's name for application-scoped
        users. Rejected when the application's MFA mode is 'disabled'. Re-enrolling
        while active requires a valid current TOTP or backup code in the body.
      parameters:
      - description: Current code (required only when re-enrolling)
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.TOTPEnrollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
