        name: page
        type: integer
      - description: 'Page size (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UsersPage'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - admin-users
    post:
      consumes:
      - application/json
      description: Creates a user in the caller's tenant with an optional role. Requires
        admin:access.
      parameters:
      - description: User details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.UserResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - admin-users
  /api/v1/users/{id}:
    delete:
      description: Soft-deletes a user (is_deleted=true, is_active=false). ID preserved
        for audit. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - admin-users
    get:
      description: Returns a user's details. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserResult'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user
      tags:
      - admin-users
    put:
      consumes:
      - application/json
      description: Updates a user's profile (email, name). Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - admin-users
  /api/v1/users/{id}/detail:
    get:
      description: Returns a user's profile plus MFA status, linked identities, active-session
        count, and last activity. Requires users:read.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get enriched user detail
      tags:
      - admin-users
  /api/v1/users/{id}/force-password-reset:
    post:
      description: Sends a password reset email to the specified user. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Force password reset
      tags:
      - admin-users
  /api/v1/users/{id}/identities:
    get:
      description: Returns the external identities (Google etc.) linked to one user
        in the caller's tenant. Requires users:read.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.UserIdentityDetail'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a user's linked social identities
      tags:
      - oauth
  /api/v1/users/{id}/identities/{provider}:
    delete:
      description: Removes the provider link. Refused when it is the user's only login
        method (no password and no other identity). Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Provider (google, github)
        in: path
        name: provider
        required: true
        type: string
      responses:
        "204":
          description: Unlinked
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Unlink a social identity from a user
      tags:
      - oauth
  /api/v1/users/{id}/invite:
    post:
      description: Emails a fresh invitation link to the user, invalidating any previous
        one. Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Resend a user invitation
      tags:
      - admin-users
  /api/v1/users/{id}/mfa:
    get:
      description: Returns the user's enrolled MFA methods and remaining backup codes.
        Requires users:read.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserMFAStatus'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a user's MFA status
      tags:
      - admin-users
  /api/v1/users/{id}/role:
    put:
      consumes:
      - application/json
      description: Sets the user's role within the tenant. Requires admin:access.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role ID to assign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign role to user
      tags:
      - admin-users
  /api/v1/users/{id}/sessions:
    delete:
      description: Revokes every active session and invalidates issued tokens, signing
        the user out everywhere. Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke all of a user's sessions
      tags:
      - admin-users
    get:
      description: Returns the user's active sessions (one per session family) with
        IP, user agent, and last activity. Requires users:read.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/admin.UserSession'
              type: array
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List a user's active sessions
      tags:
      - admin-users
  /api/v1/users/{id}/sessions/{familyID}:
    delete:
      description: Revokes one session family for the user. Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Session family ID
        in: path
        name: familyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke a single user session
      tags:
      - admin-users
  /api/v1/users/{id}/status:
    put:
      consumes:
      - application/json
      description: Sets a user's active status. Blocking (is_active=false) revokes
        all sessions and invalidates issued tokens. Requires users:write.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Desired status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SetUserStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UserResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Block or unblock a user
      tags:
      - admin-users
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - system
  /oauth/{provider}/callback:
    get:
      description: Consumes the single-use state, exchanges the code (PKCE), verifies
        the provider ID token, resolves/links/provisions the user, and redirects back
        to the application with a one-time login_code.
      parameters:
      - description: Provider (google, github)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code from the provider
        in: query
        name: code
        type: string
      - description: Opaque state issued at login start
        in: query
        name: state
        required: true
        type: string
      - description: Provider error (e.g. access_denied)
        in: query
        name: error
        type: string
      responses:
        "302":
          description: Redirect back to the application
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Social login callback
      tags:
      - oauth
  /oauth/{provider}/login:
    get:
      description: Validates the application and redirect target, then redirects the
        browser to the provider's consent screen (Authorization Code + PKCE).
      parameters:
      - description: Provider (google, github)
        in: path
        name: provider
        required: true
        type: string
      - description: Application client_id
        in: query
        name: client_id
        required: true
        type: string
      - description: Post-login redirect target (must be in the application's allow-list;
          optional when the list has exactly one entry)
        in: query
        name: redirect
        type: string
      responses:
        "302":
          description: Redirect to provider
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start social login
      tags:
      - oauth
  /oauth/authorize:
    get:
      description: Starts the Authorization Code flow with PKCE. Validates the client
        and redirect_uri, authenticates the user through a server-rendered login page,
        and redirects back to redirect_uri with a single-use code. Browser endpoint
        — returns HTML or a 302, never JSON.
      parameters:
      - description: Registered client_id
        in: query
        name: client_id
        required: true
        type: string
      - description: Must exactly match a registered redirect_uri. Optional only when
          exactly one is registered.
        in: query
        name: redirect_uri
        type: string
      - description: Must be 'code'
        in: query
        name: response_type
        required: true
        type: string
      - description: Space-delimited. Unregistered scopes are dropped, not rejected.
        in: query
        name: scope
        type: string
      - description: Opaque value echoed back on the redirect
        in: query
        name: state
        type: string
      - description: OIDC nonce, echoed into the ID token
        in: query
        name: nonce
        type: string
      - description: base64url(SHA256(code_verifier))
        in: query
        name: code_challenge
        required: true
        type: string
      - description: Must be 'S256'
        in: query
        name: code_challenge_method
        required: true
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to redirect_uri with code and state
        "400":
          description: HTML error page — client_id or redirect_uri invalid
      summary: OAuth 2.0 authorization endpoint
      tags:
      - oauth
  /oauth/revoke:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Revokes a refresh token. Client authentication is REQUIRED (RFC
        7009 §2.1) — the same credentials the token endpoint takes. Returns 200 for
        an unknown or already-revoked token, per RFC 7009 §2.2; a bad or missing client
        credential is a 401 invalid_client.
      parameters:
      - description: The token to revoke
        in: formData
        name: token
        required: true
        type: string
      - description: refresh_token | access_token
        in: formData
        name: token_type_hint
        type: string
      - description: Required — prefer the Authorization Basic header
        in: formData
        name: client_id
        required: true
        type: string
      - description: Confidential clients only
        in: formData
        name: client_secret
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Token revoked, or did not exist
        "401":
          description: client authentication failed
          schema:
            $ref: '#/definitions/handlers.tokenError'
      summary: OAuth 2.0 token revocation
      tags:
      - oauth
  /oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Exchanges credentials for tokens. Supports authorization_code (with
        mandatory PKCE), refresh_token, and client_credentials. Form-encoded per RFC
        6749 — not JSON. Client authentication via Authorization Basic or client_secret_post;
        public clients authenticate with PKCE alone.
      parameters:
      - description: authorization_code | refresh_token | client_credentials
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Required for authorization_code
        in: formData
        name: code
        type: string
      - description: Required for authorization_code
        in: formData
        name: code_verifier
        type: string
      - description: Must match the value the code was issued against
        in: formData
        name: redirect_uri
        type: string
      - description: Required for refresh_token
        in: formData
        name: refresh_token
        type: string
      - description: Required for public clients
        in: formData
        name: client_id
        type: string
      - description: Confidential clients — prefer the Authorization Basic header
        in: formData
        name: client_secret
        type: string
      - description: client_credentials only
        in: formData
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.tokenError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.tokenError'
      summary: OAuth 2.0 token endpoint
      tags:
      - oauth
  /oauth/userinfo:
    get:
      description: Standard OpenID Connect UserInfo endpoint. Returns claims about
        the user behind the presented access token. Requires a user access token (aud=emc-auth-api);
        machine, management, and agent tokens are rejected.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserInfoResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: OIDC UserInfo
      tags:
      - oidc
  /saml/acs:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Receives IdP SAMLResponse. Currently returns 501 — disabled until
        IdP XML signature verification is implemented.
      produces:
      - application/json
      responses:
        "501":
          description: Not yet implemented
          schema:
            additionalProperties:
              type: string
            type: object
      summary: SAML Assertion Consumer Service (disabled)
      tags:
      - saml
  /saml/login:
    get:
      description: Redirects the browser to the configured IdP with a signed SAMLRequest.
      parameters:
      - description: Tenant ID
        in: query
        name: tenant
        required: true
        type: string
      responses:
        "302":
          description: Redirect to IdP
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Initiate SP-initiated SAML SSO
      tags:
      - saml
  /saml/metadata:
    get:
      description: Returns SAML Service Provider metadata XML for the given tenant.
        Used by IdPs to configure the SP.
      parameters:
      - description: Tenant ID
        in: query
        name: tenant
        required: true
        type: string
      produces:
      - application/xml
      responses:
        "200":
          description: SP metadata XML
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get SP metadata XML
      tags:
      - saml
  /tenants/{slug}/.well-known/jwks.json:
    get:
      description: Public keys for verifying this tenant's access tokens. Contains
        the active key, any pre-published next key, and recently retired keys. Never
        contains private key material.
      parameters:
      - description: Tenant slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Tenant JWKS (public signing keys)
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer <your_access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
