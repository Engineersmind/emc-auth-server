basePath: /
definitions:
  admin.CreateTenantResult:
    properties:
      owner:
        $ref: '#/definitions/admin.OwnerResult'
      tenant:
        $ref: '#/definitions/admin.TenantResult'
    type: object
  admin.OwnerResult:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
      temp_password:
        type: string
    type: object
  admin.PermissionResult:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      tenant_id:
        type: string
    type: object
  admin.RoleResult:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_system:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/admin.PermissionResult'
        type: array
      tenant_id:
        type: string
    type: object
  admin.TenantDashboardDelta:
    properties:
      active_tenants_pct:
        type: number
      total_applications_pct:
        type: number
      total_tenants_pct:
        type: number
      total_users_pct:
        type: number
    type: object
  admin.TenantDashboardStats:
    properties:
      active_tenants:
        type: integer
      delta:
        $ref: '#/definitions/admin.TenantDashboardDelta'
      total_applications:
        type: integer
      total_tenants:
        type: integer
      total_users:
        type: integer
    type: object
  admin.TenantResult:
    properties:
      cors_origins:
        items:
          type: string
        type: array
      created_at:
        type: string
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      plan:
        type: string
      region:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  admin.TenantsPage:
    properties:
      data:
        items:
          $ref: '#/definitions/admin.TenantResult'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  admin.UserResult:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
      role:
        type: string
      role_id:
        type: string
      tenant_id:
        type: string
    type: object
  admin.UsersPage:
    properties:
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
      users:
        items:
          $ref: '#/definitions/admin.UserResult'
        type: array
    type: object
  audit.LogEntry:
    properties:
      action:
        type: string
      actor_email:
        type: string
      agent_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      ip_address:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      tenant_id:
        type: string
      tenant_slug:
        type: string
      user_id:
        type: string
    type: object
  audit.LogsPage:
    properties:
      logs:
        items:
          $ref: '#/definitions/audit.LogEntry'
        type: array
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  audit.StatsResult:
    properties:
      active_users_week:
        type: integer
      failed_logins_today:
        type: integer
      logins_today:
        type: integer
      logouts_today:
        type: integer
      recent_events:
        items:
          $ref: '#/definitions/audit.LogEntry'
        type: array
      total_audit_events:
        type: integer
    type: object
  auth.APIKeyResult:
    properties:
      created_at:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  auth.APIKeySummary:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  auth.AgentAnalysis:
    properties:
      agent_id:
        type: string
      agent_name:
        type: string
      agent_type:
        type: string
      off_hours_count_24h:
        description: requests outside 08:00–20:00 UTC
        type: integer
      rate_limit_hits_24h:
        description: events with action containing "rate_limit"
        type: integer
      request_count_24h:
        description: total audit events in last 24h
        type: integer
      risk_factors:
        description: human-readable reasons for elevated score
        items:
          type: string
        type: array
      risk_score:
        description: 0–100 composite score
        type: integer
      unique_ips_24h:
        description: distinct IP addresses seen
        type: integer
    type: object
  auth.AgentRegistrationResult:
    properties:
      agent_type:
        type: string
      capabilities:
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: string
      key:
        description: shown once — never stored
        type: string
      key_prefix:
        type: string
      name:
        type: string
    type: object
  auth.AgentWithStats:
    properties:
      agent_type:
        type: string
      capabilities:
        items:
          type: string
        type: array
      created_at:
        type: string
      id:
        type: string
      key_prefix:
        type: string
      last_active:
        description: most recent audit event timestamp
        type: string
      last_used_at:
        type: string
      name:
        type: string
      request_count:
        description: total audit events attributed to this agent
        type: integer
    type: object
  auth.AppRateLimit:
    properties:
      app_id:
        type: string
      burst:
        type: integer
      created_at:
        type: string
      description:
        type: string
      requests_per_minute:
        type: integer
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  auth.AppResult:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth.AppSummary:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth.AuthResult:
    properties:
      access_token:
        type: string
      expires_at:
        description: UTC unix timestamp when access token expires
        type: integer
      expires_in:
        description: seconds until access token expires
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.EnrollResult:
    properties:
      backup_codes:
        items:
          type: string
        type: array
      otp_uri:
        type: string
    type: object
  auth.MeResult:
    properties:
      email:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      tenant_id:
        type: string
      user_id:
        type: string
    type: object
  handlers.AppLimitRequest:
    properties:
      app_id:
        type: string
      burst:
        type: integer
      description:
        type: string
      requests_per_minute:
        type: integer
    type: object
  handlers.AssignRoleRequest:
    properties:
      role_id:
        type: string
    type: object
  handlers.AuthenticateAgentRequest:
    properties:
      key:
        type: string
      tenant_id:
        type: string
    type: object
  handlers.CreateAPIKeyRequest:
    properties:
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  handlers.CreateApplicationRequest:
    properties:
      name:
        type: string
    type: object
  handlers.CreatePermissionRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  handlers.CreateRoleRequest:
    properties:
      name:
        type: string
      permission_ids:
        items:
          type: string
        type: array
    type: object
  handlers.CreateTenantRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      name:
        type: string
      plan:
        type: string
      region:
        type: string
      slug:
        type: string
    type: object
  handlers.CreateUserAdminRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      role_id:
        type: string
    type: object
  handlers.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
    type: object
  handlers.LoginOTPRequest:
    properties:
      code:
        type: string
      otp_session_token:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.RegisterAgentRequest:
    properties:
      agent_type:
        type: string
      capabilities:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  handlers.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  handlers.SessionLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.SlugCheckResponse:
    properties:
      available:
        type: boolean
      slug:
        type: string
    type: object
  handlers.TOTPActivateRequest:
    properties:
      code:
        type: string
    type: object
  handlers.TOTPDisableRequest:
    properties:
      code:
        type: string
    type: object
  handlers.TokenRequest:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      grant_type:
        type: string
    type: object
  handlers.UpdateCORSOriginsRequest:
    properties:
      origins:
        description: e.g. ["https://app.example.com"]
        items:
          type: string
        type: array
    type: object
  handlers.UpdateRolePermissionsRequest:
    properties:
      permission_ids:
        items:
          type: string
        type: array
    type: object
  handlers.UpdateTenantRequest:
    properties:
      description:
        type: string
      display_name:
        type: string
      domain:
        type: string
      name:
        type: string
      plan:
        type: string
      region:
        type: string
    type: object
  handlers.UpdateUserAdminRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  saml.SAMLConfig:
    properties:
      certificate:
        type: string
      created_at:
        type: string
      entity_id:
        type: string
      id:
        type: string
      sso_url:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8082
info:
  contact:
    name: EngineersMind
    url: https://github.com/engineersmind/emc-auth-server
  description: Standalone multi-tenant Identity Provider — email/password auth, JWT,
    refresh tokens, TOTP 2FA, SAML 2.0, RBAC, Admin UI, and AI/Agent security.
  license:
    name: MIT
  title: EMC Auth Server
  version: 1.5.0
paths:
  /api/v1/agents:
    get:
      description: Returns all active agent registrations for the requesting tenant.
        Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.AgentWithStats'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List agent registrations
      tags:
      - agent-management
    post:
      consumes:
      - application/json
      description: Creates an agent registration and returns the raw API key once.
        Requires admin:access.
      parameters:
      - description: Agent details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AgentRegistrationResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Register a new agent
      tags:
      - agent-management
  /api/v1/agents/{id}:
    delete:
      description: Revokes an agent registration belonging to the requesting tenant.
        Requires admin:access.
      parameters:
      - description: Agent UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an agent registration
      tags:
      - agent-management
  /api/v1/agents/analysis:
    get:
      description: Returns risk-scored analysis for all active agents in the tenant.
        Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AgentAnalysis'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get 24h agent risk analysis
      tags:
      - agent-management
  /api/v1/agents/authenticate:
    post:
      consumes:
      - application/json
      description: Validates an agent API key and returns a signed short-lived JWT.
        Public â€” no prior auth required.
      parameters:
      - description: Agent key and tenant ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthenticateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate an agent and issue a JWT
      tags:
      - agent-auth
  /api/v1/api-keys:
    get:
      description: Returns all active API keys for the caller's tenant. The raw key
        is never included.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.APIKeySummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: Creates a new API key for machine-to-machine auth. The raw key
        is returned exactly once.
      parameters:
      - description: Key name and permissions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.APIKeyResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - api-keys
  /api/v1/api-keys/{id}:
    delete:
      description: Permanently revokes an API key. The key is immediately invalid.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke API key
      tags:
      - api-keys
  /api/v1/app-limits:
    get:
      description: Returns all per-app rate limit configs for the caller's tenant.
        Requires admin:access.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.AppRateLimit'
            type: array
      security:
      - BearerAuth: []
      summary: List app rate limits
      tags:
      - admin-rate-limits
    post:
      consumes:
      - application/json
      description: Sets a custom per-minute request limit for an application identified
        by X-App-ID. Requires admin:access.
      parameters:
      - description: App limit config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AppLimitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AppRateLimit'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: app_id already has a rate limit config
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create app rate limit
      tags:
      - admin-rate-limits
  /api/v1/app-limits/{app_id}:
    delete:
      description: Removes the custom rate limit for an app_id; it falls back to the
        default limit. Requires admin:access.
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete app rate limit
      tags:
      - admin-rate-limits
    put:
      consumes:
      - application/json
      description: Updates the rate limit config for an existing app_id in the tenant.
        Requires admin:access.
      parameters:
      - description: App ID
        in: path
        name: app_id
        required: true
        type: string
      - description: Updated limit config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AppLimitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AppRateLimit'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update app rate limit
      tags:
      - admin-rate-limits
  /api/v1/applications:
    get:
      description: Returns all active applications for the caller's tenant.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.AppSummary'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List applications
      tags:
      - admin-applications
    post:
      consumes:
      - application/json
      description: Registers a new application for the tenant. Returns client_id and
        client_secret â€” secret is shown exactly once.
      parameters:
      - description: Application name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AppResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create application
      tags:
      - admin-applications
  /api/v1/applications/{id}:
    delete:
      description: Soft-deletes an application. Its client_id is immediately rejected
        on login and register.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deactivate application
      tags:
      - admin-applications
  /api/v1/audit-logs:
    get:
      description: Returns paginated audit events scoped to the caller's tenant. Requires
        admin:access.
      parameters:
      - description: Filter by action (e.g. auth.login)
        in: query
        name: action
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: From datetime (RFC3339, e.g. 2026-01-01T00:00:00Z)
        in: query
        name: from
        type: string
      - description: To datetime (RFC3339)
        in: query
        name: to
        type: string
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audit.LogsPage'
      security:
      - BearerAuth: []
      summary: Tenant audit log
      tags:
      - admin-audit
  /api/v1/audit-logs/system:
    get:
      description: Returns paginated audit events across ALL tenants. Requires tenant:manage
        (super_admin only).
      parameters:
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: From datetime (RFC3339)
        in: query
        name: from
        type: string
      - description: To datetime (RFC3339)
        in: query
        name: to
        type: string
      - description: Page (default 1)
        in: query
        name: page
        type: integer
