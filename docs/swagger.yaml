  /api/v1/auth/management-token:
    post:
      description: 'Authenticates an API key (X-API-Key or Authorization: ApiKey)
        and returns a short-lived management JWT valid for 15 minutes. Use the returned
        token as Bearer auth on admin endpoints.'
      parameters:
      - description: 'API key (emck_…). Alternative: Authorization: ApiKey <key>'
