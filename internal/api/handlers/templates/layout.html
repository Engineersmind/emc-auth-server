{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Referrer-Policy: no-referrer is not optional on these pages.

  The authorization request handle travels in the URL. Without this header a
  browser would put that URL in the Referer of every outbound request the page
  makes, handing a live login handle to any third party the page touches.
  The pages below load no external resources precisely so that surface stays
  empty, but the header is the control that makes it true rather than
  incidental.
-->
<meta name="referrer" content="no-referrer">
<title>{{.Title}}</title>
<style>
/* All CSS inline. These pages must render with no network access beyond the
   auth server itself: an external font or stylesheet would leak the request
   URL to a third party and break the page whenever that host is unreachable. */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f4f5f7;color:#1f2328;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.card{background:#fff;width:100%;max-width:400px;margin:24px;padding:32px;
  border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.06)}
h1{margin:0 0 4px;font-size:20px;font-weight:600}
.sub{margin:0 0 24px;color:#5c6470;font-size:14px}
.app{font-weight:600;color:#1f2328}
label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:#3d4450}
input[type=email],input[type=password],input[type=text]{width:100%;padding:10px 12px;
  border:1px solid #d0d5dd;border-radius:6px;font-size:15px;background:#fff;color:#1f2328}
input:focus{outline:2px solid #2563eb;outline-offset:-1px;border-color:#2563eb}
.field{margin-bottom:16px}
button{width:100%;padding:11px;border:0;border-radius:6px;background:#2563eb;color:#fff;
  font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#1d4ed8}
.error{margin:0 0 20px;padding:11px 13px;border-radius:6px;background:#fef2f2;
  border:1px solid #fecaca;color:#991b1b;font-size:14px}
.code-input{letter-spacing:.35em;text-align:center;font-size:20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.foot{margin:20px 0 0;text-align:center;font-size:12px;color:#8b929e}
@media (prefers-color-scheme:dark){
  body{background:#15181d;color:#e6e8eb}
  .card{background:#1c2027;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .sub{color:#9aa3af}.app{color:#e6e8eb}label{color:#c3c9d2}
  input[type=email],input[type=password],input[type=text]{background:#12151a;border-color:#333a45;color:#e6e8eb}
  .error{background:#3b1315;border-color:#7f2225;color:#fca5a5}
  .foot{color:#6b7280}
}
</style>
</head>
<body>
<main class="card">
{{template "content" .}}
<p class="foot">Secured by EMC Auth</p>
</main>
</body>
</html>{{end}}
