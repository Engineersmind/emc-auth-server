name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build + Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build React SPA
        working-directory: ui
        run: |
          npm ci --silent
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test ./... -timeout 60s

      - name: Build linux/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
              -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }}" \
              -o emc-auth-server-linux-amd64 ./cmd/server/

      - name: Build linux/arm64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build \
              -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.Commit=${{ github.sha }}" \
              -o emc-auth-server-linux-arm64 ./cmd/server/

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          else
            CHANGES=$(git log --pretty=format:"- %s" HEAD)
          fi
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            emc-auth-server-linux-amd64 \
            emc-auth-server-linux-arm64 \
            --title "EMC Auth Server ${{ github.ref_name }}" \
            --notes "## Changes
          ${{ steps.changelog.outputs.changes }}

          ## Docker (ECR)
          Deployed automatically to \`auth.senie.ai\` via CI/CD pipeline on merge to master.

          ## Upgrade
          \`\`\`bash
          # Pull and restart (migrations run automatically on startup)
          docker pull <ecr-image>:<tag>
          docker restart emc-auth-app
          \`\`\`" \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
