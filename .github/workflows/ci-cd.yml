name: CI/CD

on:
  push:
    branches: [master]


permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:    ${{ vars.AWS_REGION }}
  ECR_REPO:      ${{ vars.ECR_REPO }}
  EC2_TAG_NAME:  ${{ vars.EC2_TAG_NAME }}
  SECRET_NAME:   ${{ vars.SECRET_ID }}
  DOMAIN:        ${{ vars.DOMAIN }}

jobs:
  # ── Build & push Docker image to ECR ─────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    # Skip gracefully when AWS variables are not configured
    if: vars.AWS_REGION != '' && vars.ECR_REPO != ''
    outputs:
      image_uri: ${{ steps.uri.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 8)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Export image URI
        id: uri
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.tag.outputs.tag }}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_URI}"

  # ── Deploy to EC2 via SSM ─────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Find EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_TAG_NAME }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "EC2 instance not found"; exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2: $INSTANCE_ID"

      - name: Deploy via SSM
        id: ssm
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
          REGION:    ${{ env.AWS_REGION }}
          SECRET:    ${{ env.SECRET_NAME }}
          DOMAIN:    ${{ env.DOMAIN }}
          INSTANCE:  ${{ steps.ec2.outputs.instance_id }}
        run: |
          REGISTRY=$(echo "$IMAGE_URI" | cut -d/ -f1)
          # Build SSM JSON payload — write Python to file first to avoid heredoc quoting issues
          cat > /tmp/mk.py << 'EOF'
          import json, os, sys
          img = os.environ["IMAGE_URI"]
          secret = os.environ["SECRET"]
          region = os.environ["REGION"]
          domain = os.environ["DOMAIN"]
          instance = os.environ["INSTANCE"]
          registry = img.split("/")[0]
          cmds = [
            f"aws ecr get-login-password --region {region} | docker login --username AWS --password-stdin {registry}",
            f"docker pull {img}",
            "aws secretsmanager get-secret-value --secret-id " + secret + " --region " + region + " --query SecretString --output text | python3 -c 'import sys,json; [print(k+chr(61)+str(v)) for k,v in json.load(sys.stdin).items()]' > /tmp/app.env",
            "RPASS=$(grep '^REDIS_PASSWORD=' /tmp/app.env | cut -d= -f2-) && echo \"REDIS_URL=redis://:${RPASS}@emc-auth-redis:6379\" >> /tmp/app.env",
            "echo ENV=production >> /tmp/app.env && echo PORT=8080 >> /tmp/app.env && echo JWT_ISSUER=https://" + domain + " >> /tmp/app.env && echo APP_BASE_URL=https://" + domain + " >> /tmp/app.env",
            "docker rm -f emc-auth-app 2>/dev/null || true",
            f"docker run -d --name emc-auth-app --network emc-auth-net --restart unless-stopped -p 127.0.0.1:8080:8080 --env-file /tmp/app.env {img}",
            f"echo Deployed: {img}",
          ]
          payload = {"DocumentName": "AWS-RunShellScript", "InstanceIds": [instance], "Parameters": {"commands": cmds}}
          print(json.dumps(payload, indent=2))
          EOF
          python3 /tmp/mk.py > /tmp/ssm-input.json
          cat /tmp/ssm-input.json
          CMD_ID=$(aws ssm send-command \
            --region        "$REGION" \
            --cli-input-json file:///tmp/ssm-input.json \
            --query         "Command.CommandId" \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $CMD_ID"

      - name: Wait for deployment
        run: |
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --region      "${{ env.AWS_REGION }}" \
              --command-id  "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            case "$STATUS" in
              Success) echo "Deployed successfully"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "--- STDOUT ---"
                aws ssm get-command-invocation \
                  --region      "${{ env.AWS_REGION }}" \
                  --command-id  "${{ steps.ssm.outputs.command_id }}" \
                  --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                  --query       "StandardOutputContent" --output text
                echo "--- STDERR ---"
                aws ssm get-command-invocation \
                  --region      "${{ env.AWS_REGION }}" \
                  --command-id  "${{ steps.ssm.outputs.command_id }}" \
                  --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                  --query       "StandardErrorContent" --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM command"; exit 1

      - name: Summary
        if: success()
        run: |
          echo "Deployed ${{ needs.build.outputs.image_uri }}"
          echo "EC2: ${{ steps.ec2.outputs.instance_id }}"
