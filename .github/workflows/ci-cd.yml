name: CI/CD

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:    ${{ vars.AWS_REGION }}
  ECR_REPO:      ${{ vars.ECR_REPO }}
  EC2_TAG_NAME:  ${{ vars.EC2_TAG_NAME }}
  SECRET_NAME:   ${{ vars.SECRET_ID }}
  DOMAIN:        ${{ vars.DOMAIN }}

jobs:
  # ── Build & push Docker image to ECR ─────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    # Skip gracefully when AWS variables are not configured
    if: vars.AWS_REGION != '' && vars.ECR_REPO != ''
    outputs:
      image_uri: ${{ steps.uri.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 8)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Export image URI
        id: uri
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.tag.outputs.tag }}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_URI}"

  # ── Deploy to EC2 via SSM ─────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Find EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_TAG_NAME }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "EC2 instance not found"; exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2: $INSTANCE_ID"

      - name: Deploy via SSM
        id: ssm
        run: |
          IMAGE_URI="${{ needs.build.outputs.image_uri }}"
          CMD_ID=$(aws ssm send-command \
            --region        "${{ env.AWS_REGION }}" \
            --instance-ids  "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment       "Deploy ${IMAGE_URI}" \
            --parameters    commands="/opt/emc-auth/src/scripts/deploy-ecr.sh '${IMAGE_URI}' '${{ env.SECRET_NAME }}' '${{ env.AWS_REGION }}' '${{ env.DOMAIN }}'" \
            --query         "Command.CommandId" \
            --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $CMD_ID"

      - name: Wait for deployment
        run: |
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --region      "${{ env.AWS_REGION }}" \
              --command-id  "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            case "$STATUS" in
              Success) echo "Deployed successfully"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region      "${{ env.AWS_REGION }}" \
                  --command-id  "${{ steps.ssm.outputs.command_id }}" \
                  --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                  --query       "StandardOutputContent" --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM command"; exit 1

      - name: Summary
        if: success()
        run: |
          echo "Deployed ${{ needs.build.outputs.image_uri }}"
          echo "EC2: ${{ steps.ec2.outputs.instance_id }}"
