name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:   ${{ vars.AWS_REGION }}      # e.g. us-east-1
  ECR_REPO:     ${{ vars.ECR_REPO }}        # e.g. dev-emc-auth-app
  EC2_TAG_NAME: ${{ vars.EC2_TAG_NAME }}    # e.g. dev-emc-auth-ec2
  SECRET_NAME:  ${{ vars.SECRET_ID }}        # e.g. dev/EMC_Auth  (repo var name: SECRET_ID)
  DOMAIN:       ${{ vars.DOMAIN }}          # e.g. auth.senie.ai
  APP_CONTAINER: emc-auth-app
  REDIS_CONTAINER: emc-auth-redis
  NETWORK:      emc-auth-net

jobs:

  # ── 1. Build & push Docker image to ECR ──────────────────────────────────
  # [CI-CD-01] Skip gracefully when AWS credentials are not configured.
  # Required repo secrets:  AWS_CICD_ROLE_ARN
  # Required repo variables: AWS_REGION, ECR_REPO, EC2_TAG_NAME, SECRET_ID, DOMAIN
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    if: ${{ secrets.AWS_CICD_ROLE_ARN != '' && vars.AWS_REGION != '' }}
    outputs:
      image_uri: ${{ steps.uri.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 8)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Export image URI
        id: uri
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.tag.outputs.tag }}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_URI}"

  # ── 2. Deploy to EC2 via SSM (master branch only) ───────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Find EC2 instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_TAG_NAME }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]] && { echo "EC2 not found"; exit 1; }
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2: $INSTANCE_ID"

      - name: Deploy via SSM
        id: ssm
        run: |
          IMAGE_URI="${{ needs.build.outputs.image_uri }}"
          REGION="${{ env.AWS_REGION }}"
          SECRET="${{ env.SECRET_NAME }}"
          DOMAIN="${{ env.DOMAIN }}"
          INSTANCE="${{ steps.ec2.outputs.instance_id }}"
          SCRIPT="/opt/emc-auth/src/scripts/deploy-ecr.sh"

          CMD_ID=$(aws ssm send-command \
            --region        "$REGION" \
            --instance-ids  "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment       "Deploy ${IMAGE_URI}" \
            --parameters    "commands=[
              'aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin $(echo ${IMAGE_URI} | cut -d/ -f1)',
              'docker pull ${IMAGE_URI}',
              'aws secretsmanager get-secret-value --secret-id ${SECRET} --region ${REGION} --query SecretString --output text | python3 -c \"import sys,json; [print(k+chr(61)+str(v)) for k,v in json.load(sys.stdin).items()]\" > /tmp/app.env',
              'echo REDIS_URL=redis://:$(grep ^REDIS_PASSWORD= /tmp/app.env | cut -d= -f2-)@emc-auth-redis:6379 >> /tmp/app.env',
              'echo ENV=production >> /tmp/app.env && echo PORT=8080 >> /tmp/app.env && echo JWT_ISSUER=https://${DOMAIN} >> /tmp/app.env && echo APP_BASE_URL=https://${DOMAIN} >> /tmp/app.env',
              'docker rm -f emc-auth-app 2>/dev/null || true',
              'docker run -d --name emc-auth-app --network emc-auth-net --restart unless-stopped -p 127.0.0.1:8080:8080 --env-file /tmp/app.env ${IMAGE_URI}'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $CMD_ID"

      - name: Wait for deployment
        run: |
          REGION="${{ env.AWS_REGION }}"
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE="${{ steps.ec2.outputs.instance_id }}"

          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --region      "$REGION" \
              --command-id  "$CMD_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            case "$STATUS" in
              Success) echo "✅ Deployed"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region "$REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                  --query "StandardOutputContent" --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out"; exit 1

      - name: Summary
        if: success()
        run: |
          echo "✅ Deployed ${{ needs.build.outputs.image_uri }}"
          echo "   EC2: ${{ steps.ec2.outputs.instance_id }}"