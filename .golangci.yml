version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck        # unchecked errors
    - govet           # go vet checks
    - ineffassign     # unused assignments
    - staticcheck     # advanced static analysis (includes gosimple + unused in v2)
    - gosec           # security checks
    - misspell        # typos
    - noctx           # http calls without context
    - bodyclose       # http response body not closed
    - sqlclosecheck   # sql rows/stmt not closed (renamed from sqlcloserows in v1.64+)
    - revive          # general linter (replaces golint)
  disable:
    - depguard        # dependency restrictions (not needed here)

  settings:
    gosec:
      excludes:
        - G401   # use of weak cryptographic primitive (MD5 allowed in non-security contexts)
        - G501   # import of unsafe crypto (we use bcrypt + AES-GCM explicitly)
        - G101   # false positive: string constants used as context keys, not hardcoded credentials
        - G117   # false positive: Password/Token/RefreshToken fields in API request/response DTOs
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
          disabled: true  # don't require godoc on all exported symbols

  # v2 syntax. These lived under a top-level `issues.exclude-rules` block, which
  # is v1 — schema version is "2" above, so the whole block was parsed and
  # silently ignored, and gosec/errcheck had been running against _test.go all
  # along. Moved here so the exclusions actually apply.
  exclusions:
    rules:
      - path: "_test.go"
        linters: [gosec, errcheck]
      - path: "docs/"
        linters: [errcheck, gosec, govet, staticcheck, revive, misspell]

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
